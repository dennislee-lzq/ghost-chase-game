            ctx.font = '12px Arial';
            ctx.fillStyle = '#aaaaaa';
            ctx.fillText('双人模式：WASD vs IJKL', canvas.width/2, btn3Y + 45);

            // Key settings button
            const ksBtnW = 120, ksBtnH = 35;
            const ksBtnX = canvas.width - ksBtnW - 30;
            const ksBtnY = 30;
            ctx.fillStyle = '#555555';
            ctx.fillRect(ksBtnX, ksBtnY, ksBtnW, ksBtnH);
            ctx.strokeStyle = '#888888';
            ctx.lineWidth = 2;
            ctx.strokeRect(ksBtnX, ksBtnY, ksBtnW, ksBtnH);
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Arial';
            ctx.fillText('按键设置', ksBtnX + ksBtnW/2, ksBtnY + 23);
        }

        function drawKeySettings() {
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('按键设置', canvas.width/2, 50);

            // Mode selector tabs
            const modes = ['adventure', 'mazeEndless', 'dualHero'];
            const modeNames = { adventure: '冒险模式', mazeEndless: '迷宫无尽', dualHero: '人鬼双雄' };
            const tabW = 150, tabH = 35;
            modes.forEach((mode, i) => {
                const tx = 50 + i * (tabW + 10);
                const ty = 80;
                ctx.fillStyle = keySettingsState.mode === mode ? '#3498db' : '#555555';
                ctx.fillRect(tx, ty, tabW, tabH);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.fillText(modeNames[mode], tx + tabW/2, ty + 23);
            });

            // Player selector for dualHero
            if (keySettingsState.mode === 'dualHero') {
                const p1x = canvas.width/2 - 100, p2x = canvas.width/2 + 20;
                const py = 130;
                ctx.fillStyle = keySettingsState.player === 1 ? '#aa4444' : '#555555';
                ctx.fillRect(p1x, py, 80, 30);
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Arial';
                ctx.fillText('鬼', p1x + 40, py + 20);

                ctx.fillStyle = keySettingsState.player === 2 ? '#4444aa' : '#555555';
                ctx.fillRect(p2x, py, 80, 30);
                ctx.fillStyle = '#ffffff';
                ctx.fillText('人', p2x + 40, py + 20);
            }

            // Action list
            const bindings = KEY_BINDINGS[keySettingsState.mode] || KEY_BINDINGS_CONFIG[keySettingsState.mode];
            if (bindings) {
                const actions = Object.entries(bindings).filter(([_, b]) =>
                    b.player === keySettingsState.player || b.player === 0 ||
                    (keySettingsState.player === 1 && b.player === 1) ||
                    (keySettingsState.player === 2 && b.player === 2)
                );

                ctx.textAlign = 'left';
                let y = keySettingsState.mode === 'dualHero' ? 190 : 160;
                const colWidth = canvas.width / 2;

                actions.forEach(([action, binding], idx) => {
                    const col = idx % 2;
                    const row = Math.floor(idx / 2);
                    const x = 50 + col * colWidth;
                    const yPos = y + row * 45;

                    // Highlight if selected
                    if (keySettingsState.selectingAction === action) {
                        ctx.fillStyle = keySettingsState.waitingForKey ? '#ffff00' : '#3498db';
                        ctx.fillRect(x - 10, yPos - 22, canvas.width / 2 - 60, 38);
                    }

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '16px Arial';
                    ctx.fillText(binding.description, x, yPos);

                    ctx.textAlign = 'right';
                    ctx.font = 'bold 18px Arial';
                    const displayKey = binding.key === ' ' ? 'Space' : binding.key.toUpperCase();
                    ctx.fillText(displayKey, x + 200, yPos);
                    ctx.textAlign = 'left';
                });
            }

            // Waiting for key prompt
            if (keySettingsState.waitingForKey) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('按下新按键...', canvas.width/2, canvas.height/2);
                ctx.font = '18px Arial';
                ctx.fillText('按 Escape 取消', canvas.width/2, canvas.height/2 + 40);
            }

            // Back button
            ctx.fillStyle = '#555555';
            ctx.fillRect(canvas.width/2 - 60, canvas.height - 60, 120, 40);
            ctx.fillStyle = '#ffffff';
            ctx.font = '18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('返回', canvas.width/2, canvas.height - 32);
            ctx.textAlign = 'left';
        }

        function getModeDisplayName(mode) {
            return { adventure: '冒险模式', mazeEndless: '迷宫无尽', dualHero: '人鬼双雄' }[mode] || mode;
        }

        function drawMenu() {
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('鬼 抓 人', canvas.width/2, canvas.height/2 - 60);

            ctx.font = '20px Arial';
            ctx.fillText('收集 20 个物品，从绿色出口逃脱', canvas.width/2, canvas.height/2);
            ctx.fillText('鬼会越来越快，越来越多！', canvas.width/2, canvas.height/2 + 30);

            ctx.font = '24px Arial';
            ctx.fillText('点击开始', canvas.width/2, canvas.height/2 + 90);
        }

        function drawMap() {
            // Background
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Show info - differs by mode
            ctx.fillStyle = '#ffffff';
            ctx.font = '18px Arial';
            ctx.textAlign = 'left';
            if (gameMode === 'mazeEndless') {
                const survivalSec = Math.floor((Date.now() - mazeStartTime) / 1000);
                const min = Math.floor(survivalSec / 60);
                const sec = survivalSec % 60;
                ctx.fillText(`存活: ${min}:${sec.toString().padStart(2, '0')}  鬼: ${ghosts.length}  豆子: ${mazeBeansCollected}`, 20, 30);
            } else {
                ctx.fillText(`物品: ${collectedCount}/${ITEMS_TO_WIN}  鬼: ${ghosts.length}`, 20, 30);
            }

            // Walls - more visible
            walls.forEach(w => {
                const sx = w.x - camera.x;
                const sy = w.y - camera.y;
                if (sx + w.w > 0 && sx < canvas.width && sy + w.h > 0 && sy < canvas.height) {
                    ctx.fillStyle = '#2a3a6e';
                    ctx.fillRect(sx, sy, w.w, w.h);
                    ctx.strokeStyle = '#4a6aae';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx, sy, w.w, w.h);
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#3a5a9e';
                    ctx.fillRect(sx, sy, w.w, w.h);
                    ctx.shadowBlur = 0;
                }
            });

            // Items
            items.forEach(item => {
                const screenX = item.x - camera.x;
                const screenY = item.y - camera.y;
                if (screenX < -20 || screenX > canvas.width + 20 ||
                    screenY < -20 || screenY > canvas.height + 20) return;

                ctx.beginPath();
                ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.item;
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLORS.item;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Exit
            const exitScreenX = exit.x - camera.x;
            const exitScreenY = exit.y - camera.y;
            if (exitScreenX > -50 && exitScreenX < canvas.width + 50 &&
                exitScreenY > -50 && exitScreenY < canvas.height + 50) {
                if (exit.active) {
                    const pulse = 1 + Math.sin(Date.now() / 200) * 0.3;
                    ctx.beginPath();
                    ctx.arc(exitScreenX, exitScreenY, 30 * pulse, 0, Math.PI * 2);
                    ctx.fillStyle = COLORS.exitActive;
                    ctx.shadowBlur = 40;
                    ctx.shadowColor = COLORS.exitActive;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    ctx.beginPath();
                    ctx.arc(exitScreenX, exitScreenY, 25, 0, Math.PI * 2);
                    ctx.fillStyle = COLORS.exitInactive;
                    ctx.fill();
                }
            }
        }

        function updateMazeRespawn() {
            if (gameMode !== 'mazeEndless') return;
            const now = Date.now();

            // Respawn resources every 20 seconds
            if (now - lastMazeRespawn > 20000) {
                lastMazeRespawn = now;

                // Spawn more items
                for (let i = 0; i < ITEMS_PER_SPAWN; i++) {
                    items.push(createRandomPosition());
                }

                // Spawn throwables
                const types = ['grenade', 'smokeBomb', 'banana'];
                for (let i = 0; i < 2; i++) {
                    const type = types[Math.floor(Math.random() * types.length)];
                    throwableItems.push({
                        ...createRandomPosition(),
                        type: type,
                        radius: THROWABLE_TYPES[type].radius
                    });
                }

                // Respawn skill orbs
                if (skillOrbs.length < 4) {
                    const skillTypes = ['speedBoost', 'invisibility', 'smokeScreen'];
                    for (let i = 0; i < 2; i++) {
                        const type = skillTypes[Math.floor(Math.random() * skillTypes.length)];
                        skillOrbs.push({
                            ...createRandomPosition(),
                            type: type,
                            radius: 14
                        });
                    }
                }
            }

            // Respawn missile pickups
            if (missilePickups.length < 2) {
                let pos;
                let attempts = 0;
                do {
                    pos = {
                        x: 80 + Math.random() * (WORLD_WIDTH - 160),
                        y: 80 + Math.random() * (WORLD_HEIGHT - 160)
                    };
                    attempts++;
                } while (attempts < 100 && isCollidingWithWalls(pos.x, pos.y, 15));
                missilePickups.push({ ...pos, radius: 12 });
            }

            // Respawn build block pickups
            if (buildBlockPickups.length < 1) {
                let pos;
                let attempts = 0;
                do {
                    pos = {
                        x: 80 + Math.random() * (WORLD_WIDTH - 160),
                        y: 80 + Math.random() * (WORLD_HEIGHT - 160)
                    };
                    attempts++;
                } while (attempts < 100 && isCollidingWithWalls(pos.x, pos.y, 15));
                buildBlockPickups.push({ ...pos, radius: 12 });
            }

            // Respawn ghost magnet pickups
            if (ghostMagnetPickups.length < 1) {
                let pos;
                let attempts = 0;
                do {
                    pos = {
                        x: 80 + Math.random() * (WORLD_WIDTH - 160),
                        y: 80 + Math.random() * (WORLD_HEIGHT - 160)
                    };
                    attempts++;
                } while (attempts < 100 && isCollidingWithWalls(pos.x, pos.y, 15));
                ghostMagnetPickups.push({ ...pos, radius: 12 });
            }
        }

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Clamp dt to prevent huge jumps (max 100ms)
            if (dt > 0.1) dt = 0.1;

            if (gameState === 'menu') {
                drawMenu();
            } else if (gameState === 'modeSelect') {
                drawModeSelect();
            } else if (gameState === 'keySettings') {
                drawKeySettings();
            } else if (gameState === 'playing') {
                if (gameMode === 'dualHero') {
                    updateDualHero(dt);
                } else {
                    updatePlayer(dt);
                    updateGhosts(dt);
                    updateActiveEffects(dt);
                    if (gameMode === 'mazeEndless') {
                        updateMazeRespawn();
                        updateGhostMagnets();
                        updateBuildBlockWalls();
                    }
                }
                updateCamera();

                if (gameMode === 'dualHero') {
                    // Split screen: left = ghost view (player/WASD), right = human view (player2/IJKL)
                    const ghost = player;   // Ghost is ALWAYS player (left side, WASD)
                    const human = player2;  // Human is ALWAYS player2 (right side, IJKL)

                    // Left half - Ghost view (ghost centered)
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(0, 0, canvas.width / 2, canvas.height);
                    ctx.clip();

                    // Ghost centered in left half: camera.x = ghost.x - 200
                    const halfW = canvas.width / 2;
                    const ghostCamX = ghost.x - halfW / 2;
                    const ghostCamY = ghost.y - canvas.height / 2;
                    const savedCam = { ...camera };
                    camera = {
                        x: Math.max(0, Math.min(WORLD_WIDTH - halfW, ghostCamX)),
                        y: Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, ghostCamY))
                    };

                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(0, 0, halfW, canvas.height);
                    drawMap();
                    drawDualHeroSafeZones();
                    drawDualHeroMagnetTraps();
                    drawDualHeroExit();
                    drawGhostTraps();
                    drawSurveillanceCameras();
                    drawSurveillanceBullets();
                    drawGhostTracker();
                    drawSummonedGhosts();
                    drawPlayer();
                    drawPlayer2();
                    drawRandomTeleportPickups();
                    drawTeleportBeaconPickups();
                    drawReturnBeaconPickups();
                    drawBlindfoldPickups();
                    drawCameraPickups();
                    drawSpeedBoostPickups();
                    drawGhostSkillOrbs();
                    drawReturnBeaconMarker();
                    drawInstructions();
                    drawBlindfoldOverlay();
                    drawDualHeroUI(true, ghost, human);

                    ctx.restore();

                    // Draw camera mode overlay only when NOT in fullscreen camera mode
                    if (!cameraModeActive) {
                        drawCameraModeOverlay();
                    }

                    // Right half - Camera view when active, otherwise human view
                    if (cameraModeActive) {
                        // Full camera view mode - centered on camera position
                        const cam = surveillanceCameras[cameraModeTarget];
                        if (cam) {
                            // Center view on camera position
                            const camViewX = cam.x - halfW / 2;
                            const camViewY = cam.y - canvas.height / 2;
                            camera = {
                                x: Math.max(0, Math.min(WORLD_WIDTH - halfW, camViewX)),
                                y: Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, camViewY))
                            };
                        }
                        drawCameraViewFullscreen();
                    } else {
                        // Normal human view
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(halfW, 0, halfW, canvas.height);
                        ctx.clip();

                        // Human centered in right half: camera.x = human.x - (halfW + halfW/2) = human.x - 600
                        const humanCamX = human.x - (halfW + halfW / 2);
                        const humanCamY = human.y - canvas.height / 2;
                        camera = {
                            x: Math.max(0, Math.min(WORLD_WIDTH - halfW, humanCamX)),
                            y: Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, humanCamY))
                        };

                        ctx.fillStyle = '#1a1a2e';
                        ctx.fillRect(halfW, 0, halfW, canvas.height);
                        drawMap();
                        drawDualHeroSafeZones();
                        drawDualHeroMagnetTraps();
                        drawDualHeroExit();
                        drawGhostTraps();
                        drawSurveillanceCameras();
                        drawSurveillanceBullets();
                        drawSummonedGhosts();
                        drawPlayer();
                        drawPlayer2();
                        drawRandomTeleportPickups();
                        drawTeleportBeaconPickups();
                        drawReturnBeaconPickups();
                        drawBlindfoldPickups();
                        drawCameraPickups();
                        drawSpeedBoostPickups();
                        drawHumanSkillOrbs();
                        drawReturnBeaconMarker();
                        drawInstructions();
                        drawDualHeroUI(false, ghost, human);

                        ctx.restore();
                    }

                    camera = savedCam;

                    // Draw teleport beacon overlay if active
                    drawTeleportBeaconOverlay();
                } else {
                    drawMap();
                    if (gameMode === 'mazeEndless') {
                        drawSafeZones();
                        drawBuildBlockWalls();
                        drawMissilePickups();
                        drawBuildBlockPickups();
                        drawGhostMagnetPickups();
                        drawActiveGhostMagnets();
                    }
                    drawThrowableItems();
                    drawActiveEffects();
                    drawGhosts();
                    drawPlayer();
                    drawSmokeBombs();
                    drawCooldownOrbs();
                    drawSkillOrbs();
                    drawBlindfoldPickups();
                    drawCameraPickups();
                    drawSpeedBoostPickups();
                    drawSurveillanceCameras();
                    // Fog of war (draws over world but before UI)
                    if (gameMode === 'mazeEndless') drawFogOfWar();
                    drawSkillUI();
                    drawThrowableUI();
                    drawAimLine();
                    drawMissileUI();
                    drawMissileOverlay();
                    drawBlindfoldOverlay();
                    drawCameraModeOverlay();
                    drawInstructions();
                    drawMinimap();
                }
            } else if (gameState === 'gameover') {
                if (gameMode === 'dualHero') {
                    const ghost = player;   // Ghost is ALWAYS player
                    const human = player2;  // Human is ALWAYS player2

                    // Left half - Ghost view
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(0, 0, canvas.width / 2, canvas.height);
                    ctx.clip();

                    const ghostCam = { x: ghost.x - canvas.width / 4, y: ghost.y - canvas.height / 2 };
                    ghostCam.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width / 2, ghostCam.x));
                    ghostCam.y = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, ghostCam.y));
                    camera = ghostCam;

                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(0, 0, canvas.width / 2, canvas.height);
                    drawMap();
                    drawDualHeroSafeZones();
                    drawDualHeroMagnetTraps();
                    drawDualHeroExit();
                    drawGhostTraps();
                    drawSummonedGhosts();
                    drawPlayer();
                    drawPlayer2();

                    ctx.restore();

                    // Divider line
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(canvas.width / 2 - 2, 0, 4, canvas.height);

                    // Right half - Human view
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(canvas.width / 2, 0, canvas.width / 2, canvas.height);
                    ctx.clip();

                    const humanCam = { x: human.x - canvas.width * 0.75, y: human.y - canvas.height / 2 };
                    humanCam.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width / 2, humanCam.x));
                    humanCam.y = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, humanCam.y));
                    camera = humanCam;

                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(canvas.width / 2, 0, canvas.width / 2, canvas.height);
                    drawMap();
                    drawDualHeroSafeZones();
                    drawDualHeroMagnetTraps();
                    drawDualHeroExit();
                    drawGhostTraps();
                    drawSummonedGhosts();
                    drawPlayer();
                    drawPlayer2();

                    ctx.restore();

                    drawGameOver();
                } else {
                    drawMap();
                    drawGhosts();
                    drawPlayer();
                    drawGameOver();
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // Initialize key bindings from localStorage
        loadKeyBindingsFromLocalStorage();

        gameLoop(0);

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if (gameState === 'menu') {
                gameState = 'modeSelect';
            } else if (gameState === 'modeSelect') {
                const btnW = 280, btnH = 60;
                const btnX = canvas.width/2 - btnW/2;
                const btn1Y = canvas.height/2 - 100;
                const btn2Y = canvas.height/2 - 20;
                const btn3Y = canvas.height/2 + 60;

                // Key settings button
                const ksBtnW = 120, ksBtnH = 35;
                const ksBtnX = canvas.width - ksBtnW - 30;
                const ksBtnY = 30;
                if (mx >= ksBtnX && mx <= ksBtnX + ksBtnW && my >= ksBtnY && my <= ksBtnY + ksBtnH) {
                    keySettingsState = { mode: 'adventure', player: 1, selectingAction: null, waitingForKey: false };
                    gameState = 'keySettings';
                    return;
                }

                if (mx >= btnX && mx <= btnX + btnW) {
                    if (my >= btn1Y && my <= btn1Y + btnH) {
                        startGame('adventure');
                    } else if (my >= btn2Y && my <= btn2Y + btnH) {
                        startGame('mazeEndless');
                    } else if (my >= btn3Y && my <= btn3Y + btnH) {
                        startGame('dualHero');
                    }
                }
            } else if (gameState === 'keySettings') {
                if (keySettingsState.waitingForKey) return;

                // Mode tabs
                const modes = ['adventure', 'mazeEndless', 'dualHero'];
                const tabW = 150, tabH = 35;
                modes.forEach((mode, i) => {
                    const tx = 50 + i * (tabW + 10);
                    const ty = 80;
                    if (mx >= tx && mx <= tx + tabW && my >= ty && my <= ty + tabH) {
                        keySettingsState.mode = mode;
                        keySettingsState.player = 1;
                        keySettingsState.selectingAction = null;
                    }
                });

                // Player tabs for dualHero
                if (keySettingsState.mode === 'dualHero') {
                    const p1x = canvas.width/2 - 100, p2x = canvas.width/2 + 20;
                    const py = 130;
                    if (mx >= p1x && mx <= p1x + 80 && my >= py && my <= py + 30) {
                        keySettingsState.player = 1;
                        keySettingsState.selectingAction = null;
                    }
                    if (mx >= p2x && mx <= p2x + 80 && my >= py && my <= py + 30) {
                        keySettingsState.player = 2;
                        keySettingsState.selectingAction = null;
                    }
                }

                // Action selection
                const bindings = KEY_BINDINGS[keySettingsState.mode] || KEY_BINDINGS_CONFIG[keySettingsState.mode];
                if (bindings) {
                    const actions = Object.entries(bindings).filter(([_, b]) =>
                        b.player === keySettingsState.player || b.player === 0
                    );

                    let y = keySettingsState.mode === 'dualHero' ? 190 : 160;
                    const colWidth = canvas.width / 2;

                    actions.forEach(([action, binding], idx) => {
                        const col = idx % 2;
                        const row = Math.floor(idx / 2);
                        const x = 50 + col * colWidth;
                        const yPos = y + row * 45;

                        if (mx >= x - 10 && mx <= x + 200 && my >= yPos - 22 && my <= yPos + 16) {
                            keySettingsState.selectingAction = action;
                            keySettingsState.waitingForKey = true;
                        }
                    });
                }

                // Back button
                if (my >= canvas.height - 60 && my <= canvas.height - 20 && mx >= canvas.width/2 - 60 && mx <= canvas.width/2 + 60) {
                    saveKeyBindingsToLocalStorage();
                    gameState = 'modeSelect';
                }
            } else if (gameState === 'gameover') {
                gameState = 'menu';
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            // Track mouse for future use (aiming, etc.)
        });
    </script>
</body>
</html>
