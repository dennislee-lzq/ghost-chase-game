<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #16213e;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameState = 'menu'; // menu, itemSelect, playing, gameover

        // Colors from design
        const COLORS = {
            background: '#1a1a2e',
            wall: '#16213e',
            player: '#ffffff',
            ghost: 'rgba(255, 0, 0, 0.7)',
            item: '#ffd700',
            exitInactive: '#555555',
            exitActive: '#00ff00',
            ghostVision: 'rgba(255, 100, 100, 0.2)'
        };

        // Start menu
        function drawMenu() {
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GHOST CHASE', canvas.width/2, canvas.height/2 - 50);

            ctx.font = '24px Arial';
            ctx.fillText('Click to Start', canvas.width/2, canvas.height/2 + 20);
        }

        // Main game loop
        function gameLoop() {
            if (gameState === 'menu') {
                drawMenu();
            }
            requestAnimationFrame(gameLoop);
        }

        // Click handler for starting game
        canvas.addEventListener('click', () => {
            if (gameState === 'menu') {
                gameState = 'itemSelect';
            }
        });

        gameLoop();
    </script>
</body>
</html>
