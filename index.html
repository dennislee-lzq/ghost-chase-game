        function updateGhosts(dt) {
            // Spawn parameters differ by mode
            const maxGhosts = gameMode === 'mazeEndless' ? 6 : 3;
            const spawnInterval = gameMode === 'mazeEndless' ? 15000 : 20000;

            // Spawn new ghost
            if (Date.now() - lastGhostSpawn > spawnInterval && ghosts.length < maxGhosts) {
                const corners = [
                    { x: 100, y: 100 },
                    { x: WORLD_WIDTH - 100, y: 100 },
                    { x: 100, y: WORLD_HEIGHT - 100 },
                    { x: WORLD_WIDTH - 100, y: WORLD_HEIGHT - 100 }
                ];
                const corner = corners[Math.floor(Math.random() * corners.length)];
                // In maze mode, avoid spawning in safe zones
                if (gameMode === 'mazeEndless' && isInsideSafeZone(corner.x, corner.y, 18)) {
                    // Try random position instead
                    let attempts = 0;
                    let spawnX, spawnY;
                    do {
                        spawnX = 100 + Math.random() * (WORLD_WIDTH - 200);
                        spawnY = 100 + Math.random() * (WORLD_HEIGHT - 200);
                        attempts++;
                    } while (attempts < 50 && (isInsideSafeZone(spawnX, spawnY, 18) || isCollidingWithWalls(spawnX, spawnY, 18)));
                    ghosts.push(createGhost(spawnX, spawnY));
                } else {
                    ghosts.push(createGhost(corner.x, corner.y));
                }
                lastGhostSpawn = Date.now();
            }

            ghosts.forEach(ghost => {
                const distToPlayer = Math.hypot(player.x - ghost.x, player.y - ghost.y);
                const angleToPlayer = Math.atan2(player.y - ghost.y, player.x - ghost.x);

                // Check if in smoke (from thrown smoke bombs or smokeScreen skill)
                let inSmoke = false;
                for (const effect of activeEffects) {
                    if ((effect.type === 'smokeBomb' || effect.type === 'smokeScreen') && effect.active) {
                        if (Math.hypot(player.x - effect.x, player.y - effect.y) < effect.radius) {
                            inSmoke = true;
                            break;
                        }
                    }
                }

                // Check invisibility from skill
                let isInvisible = false;
                if (playerSkills.invisibility && playerSkills.invisibility.active) {
                    isInvisible = true;
                }

                // Check smokeScreen skill effect
                if (playerSkills.smokeScreen && playerSkills.smokeScreen.active) {
                    inSmoke = true;
                }

                // Maze mode: player in safe zone is invisible to ghosts
                let inSafeZone = false;
                if (gameMode === 'mazeEndless' && isInsideSafeZone(player.x, player.y, player.radius)) {
                    inSafeZone = true;
                }

                // If in alert range and not invisible, ALWAYS chase (no patrol)
                const inAlertRange = distToPlayer < ghost.alertRange && !isInvisible && !inSmoke && !inSafeZone;
                ghost.mode = inAlertRange ? 'chase' : 'patrol';

                let currentSpeed = ghost.speed;

                // Maze mode: speed scales with time (up to 1.5x after 5 minutes)
                if (gameMode === 'mazeEndless') {
                    const elapsed = (Date.now() - mazeStartTime) / 1000;
                    const speedMultiplier = 1 + Math.min(0.5, elapsed / 300);
                    currentSpeed *= speedMultiplier;
                }

                // Ghost magnet attraction (maze mode) - only attracts when at distance > 60px
                let magnetTarget = null;
                if (gameMode === 'mazeEndless') {
                    for (const magnet of activeGhostMagnets) {
                        const distM = Math.hypot(ghost.x - magnet.x, ghost.y - magnet.y);
                        if (distM < 500 && distM > 60) {
                            magnetTarget = { x: magnet.x, y: magnet.y };
                            break;
                        }
                    }
                }

                if (ghost.rushDuration > 0) {
                    ghost.rushDuration -= dt * 1000;
                    currentSpeed *= 1.8;
                }

                if (ghost.mode === 'chase') {
                    // Direct chase toward player
                    const dx = Math.cos(angleToPlayer) * currentSpeed * dt;
                    const dy = Math.sin(angleToPlayer) * currentSpeed * dt;

                    if (!moveGhostWithCollision(ghost, dx, dy)) {
                        // Stuck - teleport to player vicinity
                        teleportGhostNearPlayer(ghost);
                    }
                    ghost.angle = angleToPlayer;

                    // Rush skill more often in chase
                    if (Date.now() - ghost.lastRush > 12000 && ghost.rushDuration <= 0) {
                        ghost.rushDuration = 2000;
                        ghost.lastRush = Date.now();
                    }
                } else {
                    // Patrol - wander with unconscious player attraction
                    let targetX, targetY;

                    if (magnetTarget) {
                        // Ghost magnet pulls ghost toward it
                        targetX = magnetTarget.x;
                        targetY = magnetTarget.y;
                    } else {
                        // Unconsciously drift toward player while patrolling
                        const distToPlayer = Math.hypot(player.x - ghost.x, player.y - ghost.y);
                        if (distToPlayer < 400 && distToPlayer > 50) {
                            // Subtle attraction to player (30% weight toward player)
                            const wanderX = 100 + Math.random() * (WORLD_WIDTH - 200);
                            const wanderY = 100 + Math.random() * (WORLD_HEIGHT - 200);
                            targetX = ghost.x + (player.x - ghost.x) * 0.3 + (wanderX - ghost.x) * 0.7;
                            targetY = ghost.y + (player.y - ghost.y) * 0.3 + (wanderY - ghost.y) * 0.7;
                        } else {
                            targetX = 100 + Math.random() * (WORLD_WIDTH - 200);
                            targetY = 100 + Math.random() * (WORLD_HEIGHT - 200);
                        }
                    }

                    const angleToTarget = Math.atan2(targetY - ghost.y, targetX - ghost.x);
                    ghost.angle = angleToTarget;
                    const dx = Math.cos(angleToTarget) * currentSpeed * 0.6 * dt;
                    const dy = Math.sin(angleToTarget) * currentSpeed * 0.6 * dt;
                    moveGhostWithCollision(ghost, dx, dy);

                    // Teleport every 15 seconds in patrol
                    if (Date.now() - ghost.lastTeleport > 20000) {
                        teleportGhostNearPlayer(ghost);
                    }
                }

                // Check if caught player
                if (circleCollision(player.x, player.y, player.radius, ghost.x, ghost.y, ghost.radius)) {
                    mazeDeathTime = mazeDeathTime > 0 ? mazeDeathTime : Date.now();
                    gameState = 'gameover';
                    gameResult = 'lose';
                }
            });
        }

        function updateActiveEffects(dt) {
            const now = Date.now();
            for (let i = activeEffects.length - 1; i >= 0; i--) {
                const effect = activeEffects[i];
                const age = now - effect.startTime;

                if (age > effect.duration) {
                    activeEffects.splice(i, 1);
                    continue;
                }

                // Activate the effect after a delay
                if (!effect.active && age > 500) { // 0.5s delay before effect activates
                    effect.active = true;

                    // Grenade pushes ghosts away
                    if (effect.type === 'grenade') {
                        ghosts.forEach(ghost => {
                            const dist = Math.hypot(ghost.x - effect.x, ghost.y - effect.y);
                            if (dist < 150) {
                                const angle = Math.atan2(ghost.y - effect.y, ghost.x - effect.x);
                                const pushDist = (150 - dist) * 0.3;
                                ghost.x += Math.cos(angle) * pushDist;
                                ghost.y += Math.sin(angle) * pushDist;
                            }
                        });
                    }
                }
            }
        }

        function moveGhostWithCollision(ghost, dx, dy) {
            let moved = false;
            const mazeBlock = gameMode === 'mazeEndless';
            const newX1 = ghost.x + dx, newY1 = ghost.y + dy;
            const newX2 = ghost.x + dx, newY2 = ghost.y;
            const newX3 = ghost.x, newY3 = ghost.y + dy;

            if (!isCollidingWithWalls(newX1, newY1, ghost.radius) && !(mazeBlock && isInsideSafeZone(newX1, newY1, ghost.radius))) {
                ghost.x += dx;
                ghost.y += dy;
                moved = true;
            } else if (!isCollidingWithWalls(newX2, newY2, ghost.radius) && !(mazeBlock && isInsideSafeZone(newX2, newY2, ghost.radius))) {
                ghost.x += dx;
                moved = true;
            } else if (!isCollidingWithWalls(newX3, newY3, ghost.radius) && !(mazeBlock && isInsideSafeZone(newX3, newY3, ghost.radius))) {
                ghost.y += dy;
                moved = true;
            }
            return moved;
        }

        function teleportGhostNearPlayer(ghost) {
            // Teleport randomly in the world, not near player
            let newX, newY;
            let attempts = 0;
            do {
                newX = 100 + Math.random() * (WORLD_WIDTH - 200);
                newY = 100 + Math.random() * (WORLD_HEIGHT - 200);
                attempts++;
            } while (attempts < 50 && isCollidingWithWalls(newX, newY, ghost.radius));

            if (!isCollidingWithWalls(newX, newY, ghost.radius)) {
                ghost.x = newX;
                ghost.y = newY;
                ghost.lastTeleport = Date.now();
            }
        }

        function drawGhosts() {
            ghosts.forEach(ghost => {
                const screenX = ghost.x - camera.x;
                const screenY = ghost.y - camera.y;

                // Only draw if on screen
                if (screenX < -100 || screenX > canvas.width + 100 ||
                    screenY < -100 || screenY > canvas.height + 100) return;

                // Alert zone (red area)
                ctx.beginPath();
                ctx.arc(screenX, screenY, ghost.alertRange, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.alertZone;
                ctx.fill();

                // Ghost body with pulse
                const pulse = 1 + Math.sin(Date.now() / 150) * 0.15;
                ctx.beginPath();
                ctx.arc(screenX, screenY, ghost.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = ghost.mode === 'chase' ? '#ff2222' : COLORS.ghost;
                ctx.fill();
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ff0000';
                ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes
                const eyeOffset = 6;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(screenX - eyeOffset, screenY - 4, 4, 0, Math.PI * 2);
                ctx.arc(screenX + eyeOffset, screenY - 4, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSmokeBombs() {
            const now = Date.now();
            for (let i = smokeBombs.length - 1; i >= 0; i--) {
                const smoke = smokeBombs[i];
                const age = now - smoke.startTime;
                if (age > smoke.duration) {
                    smokeBombs.splice(i, 1);
                    continue;
                }
                const alpha = 1 - age / smoke.duration;
                const screenX = smoke.x - camera.x;
                const screenY = smoke.y - camera.y;
                ctx.beginPath();
                ctx.arc(screenX, screenY, smoke.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(80, 80, 80, ${alpha * 0.6})`;
                ctx.fill();
            }
        }

        function drawCooldownOrbs() {
            const now = Date.now();
            cooldownOrbs.forEach(orb => {
                const timeSinceCollected = now - orb.lastCollected;
                if (timeSinceCollected < COOLDOWN_ORB_DURATION) {
                    return; // Still in cooldown, don't draw
                }

                const screenX = orb.x - camera.x;
                const screenY = orb.y - camera.y;
                if (screenX < -50 || screenX > canvas.width + 50 ||
                    screenY < -50 || screenY > canvas.height + 50) return;

                // Pulsing glow
                const pulse = 1 + Math.sin(now / 200) * 0.2;
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.cooldownOrb;
                ctx.shadowBlur = 20;
                ctx.shadowColor = COLORS.cooldownOrb;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Inner circle
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });
        }

        function drawSkillOrbs() {
            const now = Date.now();
            skillOrbs.forEach(orb => {
                const screenX = orb.x - camera.x;
                const screenY = orb.y - camera.y;
                if (screenX < -50 || screenX > canvas.width + 50 ||
                    screenY < -50 || screenY > canvas.height + 50) return;

                const skillType = SKILL_TYPES[orb.type];
                const pulse = 1 + Math.sin(now / 200) * 0.2;

                // Glow
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = skillType.color;
                ctx.shadowBlur = 25;
                ctx.shadowColor = skillType.color;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Inner
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Key label
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(skillType.key.toUpperCase(), screenX, screenY + orb.radius + 14);
            });
        }

        function drawGhostSkillOrbs() {
            const now = Date.now();
            ghostSkillOrbs.forEach(orb => {
                const screenX = orb.x - camera.x;
                const screenY = orb.y - camera.y;
                if (screenX < -50 || screenX > canvas.width + 50 ||
                    screenY < -50 || screenY > canvas.height + 50) return;

                const pulse = 1 + Math.sin(now / 200) * 0.2;
                const color = orb.type === 'speedBoost' ? '#00aaff' : '#ff6666';

                // Glow
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowBlur = 25;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Inner
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });
        }

        function drawHumanSkillOrbs() {
            const now = Date.now();
            humanSkillOrbs.forEach(orb => {
                const screenX = orb.x - camera.x;
                const screenY = orb.y - camera.y;
                if (screenX < -50 || screenX > canvas.width + 50 ||
                    screenY < -50 || screenY > canvas.height + 50) return;

                const pulse = 1 + Math.sin(now / 200) * 0.2;
                const color = orb.type === 'teleport' ? '#00ffff' : (orb.type === 'trap' ? '#ff6666' : '#ff00ff');

                // Glow
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowBlur = 25;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Inner
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });
        }

        function drawMinimap() {
            const now = Date.now();
            const scaleX = MINIMAP_WIDTH / WORLD_WIDTH;
            const scaleY = MINIMAP_HEIGHT / WORLD_HEIGHT;

            // Minimap background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(MINIMAP_X, MINIMAP_Y, MINIMAP_WIDTH, MINIMAP_HEIGHT);

            // Border
            ctx.strokeStyle = '#444444';
            ctx.lineWidth = 2;
            ctx.strokeRect(MINIMAP_X, MINIMAP_Y, MINIMAP_WIDTH, MINIMAP_HEIGHT);

            // Walls
            ctx.fillStyle = COLORS.wall;
            walls.forEach(w => {
                const mx = MINIMAP_X + w.x * scaleX;
                const my = MINIMAP_Y + w.y * scaleY;
                const mw = w.w * scaleX;
                const mh = w.h * scaleY;
                ctx.fillRect(mx, my, mw, mh);
            });

            // Ghost alert ranges and teleport targets (hidden in maze mode)
            if (gameMode !== 'mazeEndless') {
                ghosts.forEach(ghost => {
                    const gmx = MINIMAP_X + ghost.x * scaleX;
                    const gmy = MINIMAP_Y + ghost.y * scaleY;

                    // Alert range circle
                    ctx.beginPath();
                    ctx.arc(gmx, gmy, ghost.alertRange * scaleX, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
                    ctx.fill();

                    // Ghost teleport warning (teleport is random, show indicator when close)
                    const timeSinceTeleport = now - ghost.lastTeleport;
                    const teleportInterval = 20000; // 20 seconds
                    if (timeSinceTeleport > teleportInterval * 0.8) {
                        // Pulsing teleport indicator around ghost
                        const pulse = 0.5 + Math.sin(now / 80) * 0.5;
                        ctx.beginPath();
                        ctx.arc(gmx, gmy, 6 + pulse * 3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 100, 100, ${0.3 + pulse * 0.4})`;
                        ctx.fill();
                    }
                });
            }

            // Safe zones on minimap (maze mode)
            if (gameMode === 'mazeEndless') {
                safeZones.forEach(sz => {
                    const smx = MINIMAP_X + sz.x * scaleX;
                    const smy = MINIMAP_Y + sz.y * scaleY;
                    ctx.beginPath();
                    ctx.arc(smx, smy, sz.radius * scaleX, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 220, 50, 0.25)';
                    ctx.fill();
                });
            }

            // Items
            items.forEach(item => {
                const imx = MINIMAP_X + item.x * scaleX;
                const imy = MINIMAP_Y + item.y * scaleY;
                ctx.beginPath();
                ctx.arc(imx, imy, 2, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.item;
                ctx.fill();
            });

            // Cooldown orbs
            cooldownOrbs.forEach(orb => {
                if (now - orb.lastCollected < COOLDOWN_ORB_DURATION) return;
                const omx = MINIMAP_X + orb.x * scaleX;
                const omy = MINIMAP_Y + orb.y * scaleY;
                ctx.beginPath();
                ctx.arc(omx, omy, 3, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.cooldownOrb;
                ctx.fill();
            });

            // Exit
            if (exit.active) {
                const emx = MINIMAP_X + exit.x * scaleX;
                const emy = MINIMAP_Y + exit.y * scaleY;
                ctx.beginPath();
                ctx.arc(emx, emy, 4, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.exitActive;
                ctx.fill();
            }

            // Ghosts (hidden in maze mode)
            if (gameMode !== 'mazeEndless') {
                ghosts.forEach(ghost => {
                    const gmx = MINIMAP_X + ghost.x * scaleX;
                    const gmy = MINIMAP_Y + ghost.y * scaleY;
                    ctx.beginPath();
                    ctx.arc(gmx, gmy, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff0000';
                    ctx.fill();
                });
            }

            // Player
            const pmx = MINIMAP_X + player.x * scaleX;
            const pmy = MINIMAP_Y + player.y * scaleY;
            ctx.beginPath();
            ctx.arc(pmx, pmy, 4, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.player;
            ctx.fill();
            ctx.shadowBlur = 5;
            ctx.shadowColor = COLORS.player;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Camera viewport rectangle
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 1;
            ctx.strokeRect(
                MINIMAP_X + camera.x * scaleX,
                MINIMAP_Y + camera.y * scaleY,
                canvas.width * scaleX,
                canvas.height * scaleY
            );
        }

        function drawThrowableItems() {

        function drawActiveEffects() {
            const now = Date.now();
            activeEffects.forEach(effect => {
                const screenX = effect.x - camera.x;
                const screenY = effect.y - camera.y;
                const age = now - effect.startTime;
                const progress = age / effect.duration;

                if (effect.type === 'grenade') {
                    // Explosion effect
                    if (effect.active) {
                        const radius = 100 * Math.sin(progress * Math.PI);
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 100, 0, ${0.5 * (1 - progress)})`;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, radius * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 0, ${0.7 * (1 - progress)})`;
                        ctx.fill();
                    } else {
                        // Grenade on ground
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff4444';
                        ctx.fill();
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#ff0000';
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                } else if (effect.type === 'smokeBomb') {
                    // Extra smoke effect
                    const radius = effect.active ? 120 : 30;
                    const alpha = effect.active ? 0.4 * (1 - progress) : 0.6;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(100, 100, 100, ${alpha})`;
                    ctx.fill();
                } else if (effect.type === 'banana') {
                    // Banana peel
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, effect.active ? 30 : 12, 0, Math.PI * 2);
                    ctx.fillStyle = effect.active ? `rgba(255, 238, 0, ${0.5 * (1 - progress)})` : '#ffee00';
                    ctx.fill();
                } else if (effect.type === 'smokeScreen') {
                    // Smoke screen skill effect
                    const radius = effect.active ? effect.radius : 30;
                    const alpha = effect.active ? 0.5 * (1 - progress) : 0.6;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(80, 80, 80, ${alpha})`;
                    ctx.fill();
                } else if (effect.type === 'missile') {
                    // Missile explosion - large orange-red expanding ring + white center
                    const radius = effect.radius * (1 + progress * 2);
                    // Expanding ring
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 80, 0, ${0.8 * (1 - progress)})`;
                    ctx.lineWidth = 6 * (1 - progress);
                    ctx.stroke();
                    // Inner orange glow
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 120, 0, ${0.4 * (1 - progress)})`;
                    ctx.fill();
                    // White center
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius * 0.2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.8 * (1 - progress)})`;
                    ctx.fill();
                } else if (effect.type === 'ghostMagnetExplode') {
                    // Ghost magnet explosion - purple expanding ring
                    const radius = effect.radius * (1 + progress * 2);
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(160, 80, 255, ${0.8 * (1 - progress)})`;
                    ctx.lineWidth = 6 * (1 - progress);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(200, 100, 255, ${0.5 * (1 - progress)})`;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius * 0.15, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.8 * (1 - progress)})`;
                    ctx.fill();
                }
            });
        }

        function drawAimLine() {
            if (gameState !== 'playing' || !isAiming) return;

            // Determine which item will be thrown
            let throwType = null;
            let throwDist = 0;
            let effectRadius = 0;
            if (playerThrowables.grenade > 0) {
                throwType = 'grenade';
                throwDist = 300;
                effectRadius = 100;
            } else if (playerThrowables.smokeBomb > 0) {
                throwType = 'smokeBomb';
                throwDist = 400;
                effectRadius = 120;
            } else if (playerThrowables.banana > 0) {
                throwType = 'banana';
                throwDist = 200;
                effectRadius = 30;
            }

            if (!throwType) return;

            // Calculate target position
            const throwAngle = player.angle || 0;
            const targetX = player.x + Math.cos(throwAngle) * throwDist;
            const targetY = player.y + Math.sin(throwAngle) * throwDist;

            // Convert to screen coordinates
            const screenPlayerX = player.x - camera.x;
            const screenPlayerY = player.y - camera.y;
            const screenTargetX = targetX - camera.x;
            const screenTargetY = targetY - camera.y;

            // Draw aim line (dashed)
            ctx.setLineDash([8, 8]);
            ctx.strokeStyle = throwType === 'grenade' ? '#ff4444' : (throwType === 'smokeBomb' ? '#888888' : '#ffee00');
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(screenPlayerX, screenPlayerY);
            ctx.lineTo(screenTargetX, screenTargetY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw effect radius circle at target
            ctx.beginPath();
            ctx.arc(screenTargetX, screenTargetY, effectRadius, 0, Math.PI * 2);
            ctx.fillStyle = throwType === 'grenade' ? 'rgba(255, 68, 68, 0.2)' : (throwType === 'smokeBomb' ? 'rgba(136, 136, 136, 0.2)' : 'rgba(255, 238, 0, 0.2)');
            ctx.fill();
            ctx.strokeStyle = throwType === 'grenade' ? '#ff4444' : (throwType === 'smokeBomb' ? '#888888' : '#ffee00');
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw target reticle
            ctx.beginPath();
            ctx.arc(screenTargetX, screenTargetY, 8, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw aiming indicator
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('[ 瞄准中 - 空格投掷 | ESC取消 ]', canvas.width / 2, 30);
        }

        function drawSkillUI() {
            ctx.textAlign = 'right';

            let yOffset = 20;
            for (const skillType in SKILL_TYPES) {
                const skill = SKILL_TYPES[skillType];

                const cooldown = skillCooldowns[skillType];
                const isActive = playerSkills[skillType] && playerSkills[skillType].active;
                const onCooldown = cooldown > 0;

                let status = '';
                let color = '#555555';

                if (!hasSkill) {
                    status = `[${skill.key}] 未拥有`;
                    color = '#555555';
                } else if (isActive) {
                    status = `[${skill.key}] ${skill.name} 激活中`;
                    color = '#00ff00';
                } else if (onCooldown) {
                    status = `[${skill.key}] ${skill.name} ${(cooldown / 1000).toFixed(1)}秒`;
                    color = '#888888';
                } else {
                    status = `[${skill.key}] ${skill.name} 就绪`;
                    color = skill.color;
                }

                ctx.fillStyle = color;
                ctx.fillText(status, canvas.width - 20, canvas.height - yOffset);
                yOffset += 20;
            }

        function startGame(mode) {
            gameMode = mode;
            playerSkills = { speedBoost: null, invisibility: null, smokeScreen: null };
            skillCooldowns = { speedBoost: 0, invisibility: 0, smokeScreen: 0 };
            playerThrowables = { grenade: 0, smokeBomb: 0, banana: 0 };
            playerCameras = 0;
            activeEffects = [];
            ghosts = [createGhost(100, 100)];
            lastGhostSpawn = Date.now();
            player.x = WORLD_WIDTH / 2;
            player.y = WORLD_HEIGHT / 2;
            player.flashTime = 0;
            player.angle = 0;
            // Adventure mode: human moves at normal speed
            if (mode !== 'dualHero') {
                player.speed = 200;
            }
            if (mode === 'mazeEndless') {
                generateMazeMap();
            } else if (mode === 'dualHero') {
                // Don't call generateMap() - startDualHero handles its own initialization
                startDualHero();
            } else {
                generateMap();
            }
            lastTime = performance.now();
            gameState = 'playing';
        }

        function updateDualHero(dt) {
            if (gameMode !== 'dualHero') return;

            // Ghost is on LEFT screen, Human is on RIGHT screen
            // Ghost ALWAYS = player, Human ALWAYS = player2
            const ghost = player;
            const human = player2;

            // Update turret angle when in camera mode (continuous rotation while keys held)
            if (cameraModeActive && cameraModeTarget !== null) {
                const cam = surveillanceCameras[cameraModeTarget];
                if (cam && cam.turretAngle !== undefined) {
                    let angleChange = 0;
                    if (keys2.i) angleChange -= 1;
                    if (keys2.k) angleChange += 1;
                    if (keys2.j) angleChange -= 1;
                    if (keys2.l) angleChange += 1;
                    cam.turretAngle += angleChange * dt * 3;
                }
            }

            // Update ghost skill cooldowns
            if (ghostSkills.teleport.cooldown > 0) ghostSkills.teleport.cooldown -= dt * 1000;
            if (ghostSkills.trap.cooldown > 0) ghostSkills.trap.cooldown -= dt * 1000;
            if (ghostSkills.summon.cooldown > 0) ghostSkills.summon.cooldown -= dt * 1000;

            // Update ghost tracker timer and cooldown
            if (ghostTrackerCooldown > 0) ghostTrackerCooldown -= dt * 1000;
            if (ghostTrackerTimer > 0) {
                ghostTrackerTimer -= dt * 1000;
                if (ghostTrackerTimer <= 0) {
                    ghostTrackerActive = false;
                    ghostTrackerTimer = 0;
                }
            }

            // Update blindfold timer
            if (blindfoldCooldown > 0) blindfoldCooldown -= dt * 1000;
            if (blindfoldActive) {
                blindfoldTimer -= dt * 1000;
                if (blindfoldTimer <= 0) {
                    blindfoldActive = false;
                    blindfoldTimer = 0;
                }
            }

            // Update ghost speed boost
            if (ghostSpeedBoostCooldown > 0) ghostSpeedBoostCooldown -= dt * 1000;
            if (ghostSpeedBoostActive) {
                ghostSpeedBoostTimer -= dt * 1000;
                if (ghostSpeedBoostTimer <= 0) {
                    ghostSpeedBoostActive = false;
                    ghostSpeedBoostTimer = 0;
                }
            }

            // Update surveillance cameras - bullet push effect and ghost destroying cameras
            const now = Date.now();
            for (let i = surveillanceCameras.length - 1; i >= 0; i--) {
                const cam = surveillanceCameras[i];

                // Check if ghost is nearby and presses B twice quickly
                const distToGhost = Math.hypot(ghost.x - cam.x, ghost.y - cam.y);
                if (distToGhost < 80) {
                    // Ghost can destroy camera when very close
                    // Mark camera as being attacked
                    if (!cam.beingDestroyed) {
                        cam.beingDestroyed = true;
                        cam.destroyTimer = 1000; // 1 second to destroy by pressing B
                        cam.lastBPress = now;
                    } else {
                        // Check if B was pressed again within 1 second
                        if (now - cam.lastBPress < 1000) {
                            // Camera destroyed
                            surveillanceCameras.splice(i, 1);
                            if (cameraModeTarget === i) {
                                cameraModeTarget = surveillanceCameras.length > 0 ? 0 : null;
                                if (cameraModeTarget === null) cameraModeActive = false;
                            } else if (cameraModeTarget > i) {
                                cameraModeTarget--;
                            }
                            continue;
                        } else {
                            cam.beingDestroyed = false;
                            cam.lastBPress = 0;
                        }
                    }
                } else {
                    cam.beingDestroyed = false;
                    cam.lastBPress = 0;
                }

                // Update camera destroy timer
                if (cam.beingDestroyed && cam.destroyTimer) {
                    cam.destroyTimer -= dt * 1000;
                    if (cam.destroyTimer <= 0) {
                        cam.beingDestroyed = false;
                    }
                }

                // Check bullet hit on ghost with proper wall bouncing
                if (cam.shootTime && now - cam.shootTime < 2000) {
                    const bulletSpeed = 500;
                    const maxDist = bulletSpeed * (now - cam.shootTime) / 1000;

                    // Calculate bullet path with proper wall reflection
                    let bulletX = cam.x;
                    let bulletY = cam.y;
                    let dx = cam.bulletDx;
                    let dy = cam.bulletDy;
                    let remainingDist = maxDist;
                    let bulletHitGhost = false;

                    for (let bounce = 0; bounce < 5 && remainingDist > 0 && !bulletHitGhost; bounce++) {
                        // Find nearest wall intersection
                        let nearestDist = remainingDist;
                        let hitWall = null;
                        let hitPoint = null;

                        for (const w of walls) {
                            const wallLines = [
                                { x1: w.x, y1: w.y, x2: w.x + w.w, y2: w.y, normal: { x: 0, y: -1 } },
                                { x1: w.x, y1: w.y + w.h, x2: w.x + w.w, y2: w.y + w.h, normal: { x: 0, y: 1 } },
                                { x1: w.x, y1: w.y, x2: w.x, y2: w.y + w.h, normal: { x: -1, y: 0 } },
                                { x1: w.x + w.w, y1: w.y, x2: w.x + w.w, y2: w.y + w.h, normal: { x: 1, y: 0 } }
                            ];

                            for (const wall of wallLines) {
                                const denom = dx * wall.normal.x + dy * wall.normal.y;
                                if (Math.abs(denom) < 0.001) continue;

                                const t = ((wall.x1 - bulletX) * wall.normal.x + (wall.y1 - bulletY) * wall.normal.y) / denom;
                                if (t <= 0 || t >= nearestDist) continue;

                                const hitX = bulletX + dx * t;
                                const hitY = bulletY + dy * t;

                                if (hitX >= Math.min(wall.x1, wall.x2) - 1 && hitX <= Math.max(wall.x1, wall.x2) + 1 &&
                                    hitY >= Math.min(wall.y1, wall.y2) - 1 && hitY <= Math.max(wall.y1, wall.y2) + 1) {
                                    nearestDist = t;
                                    hitWall = wall;
                                    hitPoint = { x: hitX, y: hitY };
                                }
                            }
                        }

                        if (hitWall && hitPoint) {
                            // Move to hit point
                            bulletX = hitPoint.x;
                            bulletY = hitPoint.y;
                            remainingDist -= nearestDist;

                            // Check if ghost is near this point before bouncing
                            if (Math.hypot(bulletX - ghost.x, bulletY - ghost.y) < ghost.radius + 10) {
                                // Push ghost away from camera
                                ghost.x += dx * CAMERA_PUSH_FORCE * dt * 10;
                                ghost.y += dy * CAMERA_PUSH_FORCE * dt * 10;
                                ghost.flashTime = now;
                                bulletHitGhost = true;
                                break;
                            }

                            // Reflect direction
                            const dot = dx * hitWall.normal.x + dy * hitWall.normal.y;
                            dx = dx - 2 * dot * hitWall.normal.x;
                            dy = dy - 2 * dot * hitWall.normal.y;
                        } else {
                            // No more walls, check final position
                            bulletX += dx * remainingDist;
                            bulletY += dy * remainingDist;
                            remainingDist = 0;

                            if (Math.hypot(bulletX - ghost.x, bulletY - ghost.y) < ghost.radius + 10) {
                                ghost.x += dx * CAMERA_PUSH_FORCE * dt * 10;
                                ghost.y += dy * CAMERA_PUSH_FORCE * dt * 10;
                                ghost.flashTime = now;
                                bulletHitGhost = true;
                            }
                        }
                    }

                    if (bulletHitGhost) {
                        cam.shootTime = 0; // Bullet hit, stop traveling
                    }
                }
            }

            // Ghost movement - ALWAYS uses WASD
            let gdx = 0, gdy = 0;
            if (keys.w) gdy -= 1;
            if (keys.s) gdy += 1;
            if (keys.a) gdx -= 1;
            if (keys.d) gdx += 1;

            if (gdx !== 0 || gdy !== 0) {
                ghost.angle = Math.atan2(gdy, gdx);
            }
            if (gdx !== 0 && gdy !== 0) { gdx *= 0.707; gdy *= 0.707; }

            // Ghost speed with boost
            const ghostSpeed = ghostSpeedBoostActive ? ghost.speed * 1.8 : ghost.speed;
            let newGhostX = ghost.x + gdx * ghostSpeed * dt;
            let newGhostY = ghost.y + gdy * ghostSpeed * dt;
            newGhostX = Math.max(30, Math.min(WORLD_WIDTH - 30, newGhostX));
            newGhostY = Math.max(30, Math.min(WORLD_HEIGHT - 30, newGhostY));

            // Ghost cannot enter safe zones
            let ghostInSafeZone = false;
            for (const sz of dualHeroSafeZones) {
                if (Math.hypot(newGhostX - sz.x, newGhostY - sz.y) < sz.radius + ghost.radius) {
                    ghostInSafeZone = true;
                    break;
                }
            }

            // Ghost cannot approach exit when active
            if (dualHeroExit.active) {
                const distToExit = Math.hypot(newGhostX - dualHeroExit.x, newGhostY - dualHeroExit.y);
                if (distToExit < 150) {
                    ghostInSafeZone = true;
                }
            }

            if (!ghostInSafeZone && !isCollidingWithWalls(newGhostX, ghost.y, ghost.radius)) ghost.x = newGhostX;
            if (!ghostInSafeZone && !isCollidingWithWalls(ghost.x, newGhostY, ghost.radius)) ghost.y = newGhostY;

            // Ghost magnet attraction for main ghost
            for (const magnet of dualHeroMagnetTraps) {
                const distM = Math.hypot(ghost.x - magnet.x, ghost.y - magnet.y);
                if (distM < 500 && distM > 30) {
                    const angle = Math.atan2(magnet.y - ghost.y, magnet.x - ghost.x);
                    ghost.x += Math.cos(angle) * 200 * dt;
                    ghost.y += Math.sin(angle) * 200 * dt;
                }
            }

            // Update teleport beacon overlay movement - uses IJKL (human's controls)
            if (teleportBeaconActive) {
                let cdx = 0, cdy = 0;
                if (keys2.i) cdy -= 1;
                if (keys2.k) cdy += 1;
                if (keys2.j) cdx -= 1;
                if (keys2.l) cdx += 1;
                if (cdx !== 0 && cdy !== 0) { cdx *= 0.707; cdy *= 0.707; }
                teleportBeaconX += cdx * TELEPORT_BEACON_SPEED * dt;
                teleportBeaconY += cdy * TELEPORT_BEACON_SPEED * dt;
                teleportBeaconX = Math.max(50, Math.min(WORLD_WIDTH - 50, teleportBeaconX));
                teleportBeaconY = Math.max(50, Math.min(WORLD_HEIGHT - 50, teleportBeaconY));
                return; // Freeze human movement while aiming
            }

            // Camera mode - human can't move, only controls turret
            if (cameraModeActive) {
                // Still check for item collection but no movement
            } else {
                // Update human movement - ALWAYS uses IJKL
                let hdx = 0, hdy = 0;
                if (keys2.i) hdy -= 1;
                if (keys2.k) hdy += 1;
                if (keys2.j) hdx -= 1;
                if (keys2.l) hdx += 1;

            if (hdx !== 0 || hdy !== 0) {
                human.angle = Math.atan2(hdy, hdx);
            }
            if (hdx !== 0 && hdy !== 0) { hdx *= 0.707; hdy *= 0.707; }

            let newHumanX = human.x + hdx * human.speed * dt;
            let newHumanY = human.y + hdy * human.speed * dt;
            // Human cannot go too far left (stay in right portion so they can see themselves)
            newHumanX = Math.max(500, Math.min(WORLD_WIDTH - 30, newHumanX));
            newHumanY = Math.max(30, Math.min(WORLD_HEIGHT - 30, newHumanY));
            if (!isCollidingWithWalls(newHumanX, human.y, human.radius)) human.x = newHumanX;
            if (!isCollidingWithWalls(human.x, newHumanY, human.radius)) human.y = newHumanY;
            } // End of camera mode check

            // Check bean collection
            for (let i = items.length - 1; i >= 0; i--) {
                if (circleCollision(human.x, human.y, human.radius, items[i].x, items[i].y, 10)) {
                    items.splice(i, 1);
                    dualHeroBeansCollected++;
                    human.flashTime = Date.now();
                    if (dualHeroBeansCollected >= 30) {
                        dualHeroExit.active = true;
                    }
                    items.push(createRandomPosition());
                }
            }

            // Check teleport item pickups
            for (let i = randomTeleportPickups.length - 1; i >= 0; i--) {
                if (circleCollision(human.x, human.y, human.radius, randomTeleportPickups[i].x, randomTeleportPickups[i].y, 12)) {
                    randomTeleportPickups.splice(i, 1);
                    playerRandomTeleports++;
                    human.flashTime = Date.now();
                    randomTeleportPickups.push(createRandomPosition());
                }
            }
            for (let i = teleportBeaconPickups.length - 1; i >= 0; i--) {
                if (circleCollision(human.x, human.y, human.radius, teleportBeaconPickups[i].x, teleportBeaconPickups[i].y, 12)) {
                    teleportBeaconPickups.splice(i, 1);
                    playerTeleportBeacons++;
                    human.flashTime = Date.now();
                    teleportBeaconPickups.push(createRandomPosition());
                }
            }
            for (let i = returnBeaconPickups.length - 1; i >= 0; i--) {
                if (circleCollision(human.x, human.y, human.radius, returnBeaconPickups[i].x, returnBeaconPickups[i].y, 12)) {
                    returnBeaconPickups.splice(i, 1);
                    playerReturnBeacons++;
                    human.flashTime = Date.now();
                    returnBeaconPickups.push(createRandomPosition());
                }
            }

            // Human picks up blindfolds
            for (let i = blindfoldPickups.length - 1; i >= 0; i--) {
                if (circleCollision(human.x, human.y, human.radius, blindfoldPickups[i].x, blindfoldPickups[i].y, 12)) {
                    blindfoldPickups.splice(i, 1);
                    playerBlindfolds++;
                    human.flashTime = Date.now();
                    blindfoldPickups.push(createRandomPosition());
                }
            }

            // Human picks up cameras (just adds to inventory, doesn't place directly)
            for (let i = cameraPickups.length - 1; i >= 0; i--) {
                if (cameraPickups[i] && circleCollision(human.x, human.y, human.radius, cameraPickups[i].x, cameraPickups[i].y, 12)) {
                    const newPos = createRandomPosition();
                    cameraPickups.splice(i, 1);
                    playerCameras++; // Just add to inventory
                    human.flashTime = Date.now();
                    if (newPos) {
                        cameraPickups.push(newPos);
                    }
                }
            }

            // Human picks up speed boosts (does NOT give to ghost - ghost must pick up its own)
            for (let i = speedBoostPickups.length - 1; i >= 0; i--) {
                if (circleCollision(human.x, human.y, human.radius, speedBoostPickups[i].x, speedBoostPickups[i].y, 12)) {
                    speedBoostPickups.splice(i, 1);
                    // ghostSpeedBoost++ removed - speed boosts are for ghost only
                    human.flashTime = Date.now();
                    speedBoostPickups.push(createRandomPosition());
                }
            }

            // Ghost also picks up speed boosts
            for (let i = speedBoostPickups.length - 1; i >= 0; i--) {
                if (circleCollision(ghost.x, ghost.y, ghost.radius, speedBoostPickups[i].x, speedBoostPickups[i].y, 12)) {
                    speedBoostPickups.splice(i, 1);
                    ghostSpeedBoost++;
                    ghost.flashTime = Date.now();
                    speedBoostPickups.push(createRandomPosition());
                }
            }

            // Check trap collision - human teleported near ghost
            for (let i = ghostTraps.length - 1; i >= 0; i--) {
                const trap = ghostTraps[i];
                if (Math.hypot(human.x - trap.x, human.y - trap.y) < trap.radius + human.radius) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 80 + Math.random() * 40;
                    human.x = ghost.x + Math.cos(angle) * dist;
                    human.y = ghost.y + Math.sin(angle) * dist;
                    human.x = Math.max(50, Math.min(WORLD_WIDTH - 50, human.x));
                    human.y = Math.max(50, Math.min(WORLD_HEIGHT - 50, human.y));
                    ghostTraps.splice(i, 1);
                    human.flashTime = Date.now();
                }
            }

            // Update summoned ghosts - affected by magnet traps
            for (let i = summonedGhosts.length - 1; i >= 0; i--) {
                const sg = summonedGhosts[i];
                if (sg.rushDuration > 0) {
                    sg.rushDuration -= dt * 1000;
                    let targetX = human.x, targetY = human.y;

                    // Magnet trap attraction takes priority
                    for (const magnet of dualHeroMagnetTraps) {
                        const distM = Math.hypot(sg.x - magnet.x, sg.y - magnet.y);
                        if (distM < 500 && distM > 30) {
                            targetX = magnet.x;
                            targetY = magnet.y;
                            break;
                        }
                    }

                    const angleToTarget = Math.atan2(targetY - sg.y, targetX - sg.x);
                    const dx = Math.cos(angleToTarget) * sg.speed * 1.8 * dt;
                    const dy = Math.sin(angleToTarget) * sg.speed * 1.8 * dt;

                    // Cannot enter safe zones
                    let sgInSafeZone = false;
                    for (const sz of dualHeroSafeZones) {
                        if (Math.hypot(sg.x + dx - sz.x, sg.y + dy - sz.y) < sz.radius + sg.radius) {
                            sgInSafeZone = true;
                            break;
                        }
                    }
                    if (!sgInSafeZone && !isCollidingWithWalls(sg.x + dx, sg.y + dy, sg.radius)) {
                        sg.x += dx;
                        sg.y += dy;
                    }
                    sg.angle = angleToTarget;

                    // Cannot catch invisible human
                    if (!dualHeroInvisibility && circleCollision(human.x, human.y, human.radius, sg.x, sg.y, sg.radius)) {
                        gameState = 'gameover';
                        gameResult = 'ghostWin';
                    }
                } else {
                    summonedGhosts.splice(i, 1);
                }
            }

            // Update magnet traps (explode after 5 seconds)
            for (let i = dualHeroMagnetTraps.length - 1; i >= 0; i--) {
                const magnet = dualHeroMagnetTraps[i];
                if (Date.now() - magnet.startTime > magnet.duration) {
                    // Kill nearby summoned ghosts
                    for (let j = summonedGhosts.length - 1; j >= 0; j--) {
                        if (Math.hypot(summonedGhosts[j].x - magnet.x, summonedGhosts[j].y - magnet.y) < 120) {
                            summonedGhosts.splice(j, 1);
                        }
                    }
                    activeEffects.push({
                        type: 'ghostMagnetExplode',
                        x: magnet.x,
                        y: magnet.y,
                        startTime: Date.now(),
                        duration: 1500,
                        radius: 120,
                        active: true
                    });
                    dualHeroMagnetTraps.splice(i, 1);
                }
            }

            // Update invisibility timer
            if (dualHeroInvisibility) {
                dualHeroInvisibilityTimer -= dt * 1000;
                if (dualHeroInvisibilityTimer <= 0) {
                    dualHeroInvisibility = false;
                    dualHeroInvisibilityTimer = 0;
                }
            }
            if (dualHeroInvisibilityCooldown > 0) {
                dualHeroInvisibilityCooldown -= dt * 1000;
                if (dualHeroInvisibilityCooldown < 0) dualHeroInvisibilityCooldown = 0;
            }

            // Check if ghost caught human directly (cannot catch invisible)
            if (!dualHeroInvisibility && circleCollision(human.x, human.y, human.radius, ghost.x, ghost.y, ghost.radius)) {
                gameState = 'gameover';
                gameResult = 'ghostWin';
            }

            // Check exit - human escaped with enough beans
            if (dualHeroExit.active && circleCollision(human.x, human.y, human.radius, dualHeroExit.x, dualHeroExit.y, 30)) {
                gameState = 'gameover';
                gameResult = 'win';
            }

            // Ghost picks up ghost skill orbs (speedBoost, etc.)
            for (let i = ghostSkillOrbs.length - 1; i >= 0; i--) {
                const orb = ghostSkillOrbs[i];
                if (circleCollision(ghost.x, ghost.y, ghost.radius, orb.x, orb.y, orb.radius)) {
                    playerSkills[orb.type] = { active: false };
                    ghostSkillOrbs.splice(i, 1);
                    ghost.flashTime = Date.now();
                }
            }
            // Respawn ghost skill orbs
            if (ghostSkillOrbs.length < 2) {
                const ghostSkillTypes = ['speedBoost'];
                const type = ghostSkillTypes[Math.floor(Math.random() * ghostSkillTypes.length)];
                ghostSkillOrbs.push({ ...createRandomPosition(), type: type, radius: 14 });
            }

            // Human picks up human skill orbs (teleport, trap, summon)
            for (let i = humanSkillOrbs.length - 1; i >= 0; i--) {
                const orb = humanSkillOrbs[i];
                if (circleCollision(human.x, human.y, human.radius, orb.x, orb.y, orb.radius)) {
                    humanSkills[orb.type] = { active: false };
                    humanSkillOrbs.splice(i, 1);
                    human.flashTime = Date.now();
                }
            }
            // Respawn human skill orbs
            if (humanSkillOrbs.length < 2) {
                const humanSkillTypes = ['teleport', 'trap', 'summon'];
                const type = humanSkillTypes[Math.floor(Math.random() * humanSkillTypes.length)];
                humanSkillOrbs.push({ ...createRandomPosition(), type: type, radius: 14 });
            }
        }

        function startDualHero() {
            // In dualHero mode: P1 (player) is ALWAYS ghost, P2 (player2) is ALWAYS human
            isPlayer1Ghost = true; // Ghost is always player
            ghostTrackerActive = false;
            ghostTrackerTimer = 0;
            ghostTrackerCooldown = 0;
            player.x = 300;
            player.y = WORLD_HEIGHT / 2;
            player.angle = 0;
            player2.x = WORLD_WIDTH - 300;
            player2.y = WORLD_HEIGHT / 2;
            player2.angle = Math.PI;
            player2.flashTime = 0;
            ghosts = [];
            ghostTraps = [];
            summonedGhosts = [];
            dualHeroStartTime = Date.now();
            dualHeroBeansCollected = 0;
            dualHeroExit = { x: WORLD_WIDTH - 150, y: WORLD_HEIGHT / 2, active: false };
            dualHeroInvisibility = false;
            dualHeroInvisibilityTimer = 0;
            dualHeroInvisibilityCooldown = 0;
            dualHeroMagnetTraps = [];

            // Generate walls for dual hero mode
            walls = [];

            // Border walls
            walls.push({ x: 0, y: 0, w: WORLD_WIDTH, h: 30 });
            walls.push({ x: 0, y: WORLD_HEIGHT - 30, w: WORLD_WIDTH, h: 30 });
            walls.push({ x: 0, y: 0, w: 30, h: WORLD_HEIGHT });
            walls.push({ x: WORLD_WIDTH - 30, y: 0, w: 30, h: WORLD_HEIGHT });

            // Interior walls - fewer than adventure mode
            const numWalls = 20 + Math.floor(Math.random() * 10);
            for (let i = 0; i < numWalls; i++) {
                const horizontal = Math.random() > 0.5;
                if (horizontal) {
                    const y = 100 + Math.random() * (WORLD_HEIGHT - 200);
                    const x = 50 + Math.random() * (WORLD_WIDTH - 300);
                    const w = 80 + Math.random() * 200;
                    walls.push({ x, y, w, h: 20 });
                } else {
                    const x = 50 + Math.random() * (WORLD_WIDTH - 200);
                    const y = 100 + Math.random() * (WORLD_HEIGHT - 300);
                    const h = 80 + Math.random() * 200;
                    walls.push({ x, y, w: 20, h });
                }
            }

            // Initialize teleport items
            playerRandomTeleports = 0;
            playerTeleportBeacons = 0;
            playerReturnBeacons = 0;
            returnBeaconPos = null;
            returnBeaconUses = 0;
            teleportBeaconActive = false;

            // Reset blindfold state
            blindfoldActive = false;
            blindfoldTimer = 0;
            blindfoldCooldown = 0;
            playerBlindfolds = 0;

            // Reset surveillance cameras
            surveillanceCameras = [];
            playerCameras = 0;
            cameraModeActive = false;
            cameraModeTarget = null;

            // Spawn pickup items on map
            randomTeleportPickups = [];
            teleportBeaconPickups = [];
            returnBeaconPickups = [];
            blindfoldPickups = [];
            cameraPickups = [];
            speedBoostPickups = [];
            ghostSkillOrbs = [];
            humanSkillOrbs = [];
            for (let i = 0; i < 3; i++) {
                randomTeleportPickups.push(createRandomPosition());
                teleportBeaconPickups.push(createRandomPosition());
                returnBeaconPickups.push(createRandomPosition());
                blindfoldPickups.push(createRandomPosition());
                cameraPickups.push(createRandomPosition());
                speedBoostPickups.push(createRandomPosition());
            }
            // Spawn initial skill orbs
            for (let i = 0; i < 2; i++) {
                const ghostType = 'speedBoost';
                ghostSkillOrbs.push({ ...createRandomPosition(), type: ghostType, radius: 14 });
                const humanTypes = ['teleport', 'trap', 'summon'];
                const humanType = humanTypes[Math.floor(Math.random() * humanTypes.length)];
                humanSkillOrbs.push({ ...createRandomPosition(), type: humanType, radius: 14 });
            }

            // Reset ghost speed boost
            ghostSpeedBoost = 0;
            ghostSpeedBoostActive = false;
            ghostSpeedBoostTimer = 0;
            ghostSpeedBoostCooldown = 0;

            ghostSkills = {
                teleport: { cooldown: 0, maxCooldown: 8000 },
                trap: { cooldown: 0, maxCooldown: 12000 },
                summon: { cooldown: 0, maxCooldown: 15000 }
            };

            // Create safe zones
            dualHeroSafeZones = [];
            for (let i = 0; i < 3; i++) {
                dualHeroSafeZones.push({
                    x: 200 + Math.random() * (WORLD_WIDTH - 400),
                    y: 200 + Math.random() * (WORLD_HEIGHT - 400),
                    radius: 60 + Math.random() * 20
                });
            }

            // Create bean pickups
            items = [];
            for (let i = 0; i < 30; i++) {
                items.push(createRandomPosition());
            }
        }
