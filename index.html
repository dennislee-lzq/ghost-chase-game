<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鬼抓人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0f1a;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            // Reinitialize fog canvas if it exists
            if (fogCanvas) {
                fogCanvas.width = canvas.width;
                fogCanvas.height = canvas.height;
            }
        });

        // Game state
        let gameState = 'menu';
        let lastTime = 0;
        let gameResult = '';

        // Map settings - large world
        const WORLD_WIDTH = 3200;
        const WORLD_HEIGHT = 2400;
        const ITEMS_TO_WIN = 20;
        const ITEMS_PER_SPAWN = 5;

        // Minimap settings
        const MINIMAP_WIDTH = 180;
        const MINIMAP_HEIGHT = 135;
        const MINIMAP_X = 10;
        const MINIMAP_Y = 10;

        // Cooldown orb settings
        let cooldownOrbs = [];
        const COOLDOWN_ORB_DURATION = 30000;

        // Throwable items
        const THROWABLE_TYPES = {
            grenade: { color: '#ff4444', name: '手雷', radius: 8, effect: 'explosion' },
            smokeBomb: { color: '#888888', name: '烟雾弹', radius: 10, effect: 'smoke' },
            banana: { color: '#ffee00', name: '香蕉皮', radius: 10, effect: 'slip' }
        };
        let throwableItems = [];
        let playerThrowables = { grenade: 0, smokeBomb: 0, banana: 0 };
        let isAiming = false;

        // Skill system - pickup based skills
        const SKILL_TYPES = {
            speedBoost: { color: '#00aaff', name: '加速', key: 'b', cooldown: 15000, duration: 3000 },
            invisibility: { color: '#aa00ff', name: '隐身', key: 'n', cooldown: 25000, duration: 3000 },
            smokeScreen: { color: '#888888', name: '烟雾', key: 'm', cooldown: 30000, duration: 3000 }
        };
        let skillOrbs = []; // Skills on map to pick up (mazeEndless mode)
        let ghostSkillOrbs = []; // Skill orbs for ghost (dualHero mode)
        let humanSkillOrbs = []; // Skill orbs for human (dualHero mode)
        let playerSkills = { speedBoost: null, invisibility: null, smokeScreen: null }; // Player's active skills
        let humanSkills = { teleport: null, trap: null, summon: null }; // Human's active skills in dualHero
        let skillCooldowns = { speedBoost: 0, invisibility: 0, smokeScreen: 0 };
        let humanSkillCooldowns = { teleport: 0, trap: 0, summon: 0 };

        // Maze Endless mode
        let gameMode = 'adventure';  // 'adventure' | 'mazeEndless'
        let safeZones = [];          // { x, y, radius }
        let missileState = { active: false, crosshairX: 0, crosshairY: 0, crosshairSpeed: 400 };
        let playerMissiles = 0;
        let missilePickups = [];     // { x, y, radius }
        let playerBuildBlocks = 0;
        let buildBlockPickups = [];   // { x, y, radius } 建造方块拾取物
        let buildBlockWalls = [];     // { x, y, w, h, expireTime } 建造的墙
        let ghostMagnetPickups = [];   // { x, y, radius } 引鬼器拾取物
        let playerGhostMagnets = 0;
        let activeGhostMagnets = [];   // { x, y, startTime, duration: 5000 }
        let mazeStartTime = 0;
        let mazeDeathTime = 0;       // 死亡时的时间戳

        // Dual Hero mode (人鬼双雄)
        let player2 = { x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, radius: 12, speed: 360, flashTime: 0, angle: 0 };
        const keys2 = { i: false, j: false, k: false, l: false };

        // === KEY BINDINGS CONFIGURATION ===
        const KEY_BINDINGS_CONFIG = {
            adventure: {
                moveUp:    { key: 'w', description: '上', player: 1 },
                moveDown:  { key: 's', description: '下', player: 1 },
                moveLeft:  { key: 'a', description: '左', player: 1 },
                moveRight: { key: 'd', description: '右', player: 1 },
                toggleAim:    { key: 'f', description: '切换瞄准', player: 1 },
                throwItem:     { key: 'Space', description: '投掷', player: 1 },
                cancelAim:     { key: 'Escape', description: '取消瞄准', player: 1 },
                skillSpeedBoost:   { key: 'b', description: '技能-加速', player: 1 },
                skillInvisibility: { key: 'n', description: '技能-隐身', player: 1 },
                skillSmokeScreen:  { key: 'm', description: '技能-烟雾', player: 1 },
                useBlindfold:  { key: 'n', description: '使用蒙眼', player: 1 },
                activateSpeedBoost: { key: 'f', description: '使用加速', player: 1 },
                placeCamera:   { key: 'c', description: '放置摄像头', player: 1 },
                viewCamera:    { key: 'v', description: '查看摄像头', player: 1 },
                activateMissile:  { key: 'g', description: '激活导弹', player: 1 },
                fireMissile:      { key: 'Space', description: '发射导弹', player: 1 },
                cancelMissile:    { key: 'Escape', description: '取消导弹', player: 1 },
                useGhostMagnet:   { key: 'x', description: '使用幽灵磁铁', player: 1 },
                useBuildBlock:    { key: 'h', description: '使用建造方块', player: 1 },
            },
            mazeEndless: {
                moveUp:    { key: 'w', description: '上', player: 1 },
                moveDown:  { key: 's', description: '下', player: 1 },
                moveLeft:  { key: 'a', description: '左', player: 1 },
                moveRight: { key: 'd', description: '右', player: 1 },
                toggleAim:    { key: 'f', description: '切换瞄准', player: 1 },
                throwItem:     { key: 'Space', description: '投掷', player: 1 },
                cancelAim:     { key: 'Escape', description: '取消瞄准', player: 1 },
                skillSpeedBoost:   { key: 'b', description: '技能-加速', player: 1 },
                skillInvisibility: { key: 'n', description: '技能-隐身', player: 1 },
                skillSmokeScreen:  { key: 'm', description: '技能-烟雾', player: 1 },
                useBlindfold:  { key: 'n', description: '使用蒙眼', player: 1 },
                activateSpeedBoost: { key: 'f', description: '使用加速', player: 1 },
                placeCamera:   { key: 'c', description: '放置摄像头', player: 1 },
                viewCamera:    { key: 'v', description: '查看摄像头', player: 1 },
                activateMissile:  { key: 'g', description: '激活导弹', player: 1 },
                fireMissile:      { key: 'Space', description: '发射导弹', player: 1 },
                cancelMissile:    { key: 'Escape', description: '取消导弹', player: 1 },
                useGhostMagnet:   { key: 'x', description: '使用幽灵磁铁', player: 1 },
                useBuildBlock:    { key: 'h', description: '使用建造方块', player: 1 },
            },
            dualHero: {
                // Ghost (Player 1 - WASD)
                ghostMoveUp:    { key: 'w', description: '鬼-上', player: 1 },
                ghostMoveDown:  { key: 's', description: '鬼-下', player: 1 },
                ghostMoveLeft:  { key: 'a', description: '鬼-左', player: 1 },
                ghostMoveRight: { key: 'd', description: '鬼-右', player: 1 },
                ghostTeleport:  { key: 'u', description: '鬼-传送', player: 1 },
                ghostSpeedBoost:{ key: 'f', description: '鬼-加速', player: 1 },
                ghostPlaceTrap: { key: 'y', description: '鬼-放置陷阱', player: 1 },
                ghostSummon:    { key: 'r', description: '鬼-召唤小鬼', player: 1 },
                ghostTracker:   { key: 'x', description: '鬼-追踪', player: 1 },
                ghostDestroyCamera: { key: 'b', description: '鬼-破坏摄像头', player: 1 },
                // Human (Player 2 - Arrow Keys)
                humanMoveUp:    { key: 'arrowup', description: '人-上', player: 2 },
                humanMoveDown:  { key: 'arrowdown', description: '人-下', player: 2 },
                humanMoveLeft:  { key: 'arrowleft', description: '人-左', player: 2 },
                humanMoveRight: { key: 'arrowright', description: '人-右', player: 2 },
                humanInvisibility: { key: '1', description: '人-隐身', player: 2 },
                humanUseBlindfold: { key: '2', description: '人-蒙眼', player: 2 },
                humanPlaceCamera:  { key: '3', description: '人-放置摄像头', player: 2 },
                humanViewCamera:   { key: '4', description: '人-查看摄像头', player: 2 },
                humanRandomTeleport: { key: '5', description: '人-随机传送', player: 2 },
                humanTeleportBeacon: { key: '6', description: '人-传送信标', player: 2 },
                humanPlaceReturnBeacon: { key: '7', description: '人-放置返回信标', player: 2 },
                humanReturnToBeacon: { key: '8', description: '人-返回信标', player: 2 },
                humanTurretUp:    { key: 'arrowup', description: '人-炮台向上', player: 2 },
                humanTurretDown:  { key: 'arrowdown', description: '人-炮台向下', player: 2 },
                humanTurretLeft:  { key: 'arrowleft', description: '人-炮台向左', player: 2 },
                humanTurretRight: { key: 'arrowright', description: '人-炮台向右', player: 2 },
                // Shared
                fireCamera:    { key: 'Space', description: '摄像头射击', player: 0 },
                cancelAction:  { key: 'Escape', description: '取消', player: 0 },
                humanConfirmTeleport: { key: 'Space', description: '确认传送', player: 2 },
                humanCancelTeleport: { key: 'Escape', description: '取消传送', player: 2 },
            }
        };

        // Runtime key bindings (merged with localStorage)
        let KEY_BINDINGS = {};

        // Track pressed state for action keys
        let _actionKeyState = {};

        // Key settings state
        let keySettingsState = {
            mode: 'adventure',
            player: 1,
            selectingAction: null,
            waitingForKey: false
        };

        // Load key bindings from localStorage
        function loadKeyBindingsFromLocalStorage() {
            try {
                const saved = localStorage.getItem('ghostChaseKeyBindings');
                if (saved) {
                    KEY_BINDINGS = JSON.parse(saved);
                    return true;
                }
            } catch (e) {
                console.warn('Failed to load key bindings:', e);
            }
            KEY_BINDINGS = JSON.parse(JSON.stringify(KEY_BINDINGS_CONFIG));
            return false;
        }

        // Save key bindings to localStorage
        function saveKeyBindingsToLocalStorage() {
            try {
                localStorage.setItem('ghostChaseKeyBindings', JSON.stringify(KEY_BINDINGS));
            } catch (e) {
                console.warn('Failed to save key bindings:', e);
            }
        }

        // Get binding for an action
        function getBinding(actionName) {
            const mode = gameMode;
            if (KEY_BINDINGS[mode] && KEY_BINDINGS[mode][actionName]) {
                return KEY_BINDINGS[mode][actionName];
            }
            if (KEY_BINDINGS_CONFIG[mode] && KEY_BINDINGS_CONFIG[mode][actionName]) {
                return KEY_BINDINGS_CONFIG[mode][actionName];
            }
            return null;
        }

        // Get special mode
        function getSpecialMode() {
            if (cameraModeActive) return 'cameraMode';
            if (teleportBeaconActive) return 'teleportBeacon';
            if (gameMode === 'mazeEndless' && missileState && missileState.active) return 'missileMode';
            return null;
        }

        // Get action for a key press
        function getActionForKey(key, context) {
            const mode = context.mode || gameMode;
            const player = context.player || 1;
            const specialMode = context.specialMode || getSpecialMode();

            // Special mode handling
            if (specialMode === 'cameraMode') {
                if (key === 'Space' || key === ' ') return 'fireCamera';
                if (key === 'Escape') return 'cancelAction';
            }
            if (specialMode === 'teleportBeacon') {
                if (key === 'Space' || key === ' ') return 'humanConfirmTeleport';
                if (key === 'Escape') return 'humanCancelTeleport';
            }
            if (specialMode === 'missileMode') {
                if (key === 'Space' || key === ' ') return 'fireMissile';
                if (key === 'Escape') return 'cancelMissile';
            }

            // Check mode-specific bindings
            const bindings = KEY_BINDINGS[mode] || KEY_BINDINGS_CONFIG[mode];
            if (bindings) {
                for (const [action, binding] of Object.entries(bindings)) {
                    const bindingKey = binding.key.toLowerCase();
                    const inputKey = key.toLowerCase();
                    if (bindingKey === inputKey && (binding.player === player || binding.player === 0)) {
                        return action;
                    }
                }
            }
            return null;
        }

        // Check if an action's key is currently pressed
        function isKeyPressed(actionName) {
            const binding = getBinding(actionName);
            if (!binding) return false;
            const key = binding.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                return keys[key] === true;
            }
            if (key === 'i' || key === 'j' || key === 'k' || key === 'l') {
                return keys2[key] === true;
            }
            return _actionKeyState[actionName] === true;
        }

        // Get movement keys for a player based on current KEY_BINDINGS
        function getPlayerMovementKeys(player) {
            const mode = gameMode;
            const bindings = KEY_BINDINGS[mode] || KEY_BINDINGS_CONFIG[mode];
            if (!bindings) return null;

            const moveActions = player === 1
                ? ['moveUp', 'moveDown', 'moveLeft', 'moveRight']
                : ['humanMoveUp', 'humanMoveDown', 'humanMoveLeft', 'humanMoveRight'];

            const keyMap = {};
            for (const action of moveActions) {
                if (bindings[action]) {
                    keyMap[action] = bindings[action].key.toLowerCase();
                }
            }
            return keyMap;
        }

        // Sync keys/keys2 state based on current KEY_BINDINGS when a key is pressed
        function syncKeysForBinding(key, pressed) {
            const mode = gameMode;
            const bindings = KEY_BINDINGS[mode] || KEY_BINDINGS_CONFIG[mode];
            if (!bindings) return;

            const keyLower = key.toLowerCase();

            // Find all actions that use this key and are movement actions
            for (const [action, binding] of Object.entries(bindings)) {
                if (binding.key.toLowerCase() !== keyLower) continue;

                // Player 1 movement keys
                if (action === 'moveUp' || action === 'ghostMoveUp') {
                    keys.w = pressed;
                } else if (action === 'moveDown' || action === 'ghostMoveDown') {
                    keys.s = pressed;
                } else if (action === 'moveLeft' || action === 'ghostMoveLeft') {
                    keys.a = pressed;
                } else if (action === 'moveRight' || action === 'ghostMoveRight') {
                    keys.d = pressed;
                }

                // Player 2 movement keys (map to i/j/k/l internally)
                if (action === 'humanMoveUp') {
                    keys2.i = pressed;
                } else if (action === 'humanMoveDown') {
                    keys2.k = pressed;
                } else if (action === 'humanMoveLeft') {
                    keys2.j = pressed;
                } else if (action === 'humanMoveRight') {
                    keys2.l = pressed;
                }

                // Also handle turret controls (same as movement)
                if (action === 'humanTurretUp') {
                    keys2.i = pressed;
                } else if (action === 'humanTurretDown') {
                    keys2.k = pressed;
                } else if (action === 'humanTurretLeft') {
                    keys2.j = pressed;
                } else if (action === 'humanTurretRight') {
                    keys2.l = pressed;
                }
            }
        }

        let isPlayer1Ghost = false;  // true = P1是鬼, P2是人
        let ghostSkills = {
            teleport: { cooldown: 0, maxCooldown: 8000 },
            trap: { cooldown: 0, maxCooldown: 12000 },
            summon: { cooldown: 0, maxCooldown: 15000 }
        };
        let ghostTraps = [];         // { x, y } 陷阱位置
        let summonedGhosts = [];      // 召唤的鬼
        let dualHeroStartTime = 0;
        const DUAL_HERO_ESCAPE_TIME = 60; // 秒后人类胜利
        let dualHeroBeansCollected = 0;
        let dualHeroExit = { x: 0, y: 0, active: false };
        let dualHeroSafeZones = [];
        let dualHeroSmokeBombs = [];
        let dualHeroInvisibility = false;
        let dualHeroInvisibilityTimer = 0;
        const DUAL_HERO_INVISIBILITY_DURATION = 3000;
        let dualHeroInvisibilityCooldown = 0;
        const DUAL_HERO_INVISIBILITY_COOLDOWN = 15000;
        let dualHeroMagnetTraps = [];  // { x, y, startTime, duration: 5000 }
        let ghostTrackerActive = false; // Ghost X key tracker showing line to human
        let ghostTrackerTimer = 0; // How long tracker has been active
        const GHOST_TRACKER_DURATION = 8000; // 8 seconds
        const GHOST_TRACKER_COOLDOWN = 20000; // 20 seconds cooldown
        let ghostTrackerCooldown = 0;

        // Blindfold item (human uses to blind ghost)
        let playerBlindfolds = 0;
        let blindfoldActive = false;
        let blindfoldTimer = 0;
        const BLINDFOLD_DURATION = 5000;
        const BLINDFOLD_COOLDOWN = 15000;
        let blindfoldCooldown = 0;

        // Surveillance cameras (human places)
        let surveillanceCameras = []; // { x, y, bullets: 10, lastShot: 0 }
        let playerCameras = 0; // Number of camera items human has
        let cameraModeActive = false;
        let cameraModeTarget = null; // which camera is being viewed
        const CAMERA_BULLET_COOLDOWN = 500; // ms between shots
        const CAMERA_PUSH_FORCE = 300; // how much bullets push ghost back
        const CAMERA_RANGE = 400; // max range for camera shooting

        // Ghost speed boost
        let ghostSpeedBoost = 0; // number of speed boosts ghost has
        let ghostSpeedBoostActive = false;
        let ghostSpeedBoostTimer = 0;
        const GHOST_SPEED_BOOST_DURATION = 3000;
        const GHOST_SPEED_BOOST_COOLDOWN = 15000;
        let ghostSpeedBoostCooldown = 0;
        let speedBoostPickups = []; // speed boost pickup items on map

        // Dual Hero teleport items
        let playerRandomTeleports = 0;  // 随机传送器数量
        let playerTeleportBeacons = 0;  // 传送器数量
        let playerReturnBeacons = 0;    // 传回信标数量
        let blindfoldPickups = [];      // 蒙眼道具拾取物
        let cameraPickups = [];         // 监控摄像头拾取物
        let returnBeaconPos = null;     // { x, y } 传回信标位置
        let returnBeaconUses = 0;       // 传回信标使用次数
        const MAX_RETURN_BEACON_USES = 3;

        // Teleport beacon overlay state
        let teleportBeaconActive = false;
        let teleportBeaconX = 0;
        let teleportBeaconY = 0;
        const TELEPORT_BEACON_SPEED = 400;

        // Pickup items on map
        let randomTeleportPickups = [];
        let teleportBeaconPickups = [];
        let returnBeaconPickups = [];

        let mazeGhostsKilled = 0;
        let mazeBeansCollected = 0;   // 豆子收集数
        let lastMazeRespawn = 0;
        let fogCanvas = null, fogCtx = null;

        // Camera
        let camera = { x: 0, y: 0 };

        // Colors
        const COLORS = {
            background: '#1a1a2e',
            wall: '#2a3a6e',
            player: '#ffffff',
            ghost: 'rgba(255, 0, 0, 0.8)',
            item: '#ffd700',
            exitInactive: '#555555',
            exitActive: '#00ff00',
            alertZone: 'rgba(255, 50, 50, 0.15)',
            cooldownOrb: '#00ffff',
            teleportTarget: 'rgba(255, 100, 100, 0.6)',
            skillOrb: '#00ffaa'
        };

        function createGhost(x, y) {
            return {
                x: x,
                y: y,
                radius: 18,
                speed: 145,
                alertRange: 280,
                angle: 0,
                mode: 'patrol',
                lastTeleport: Date.now(),
                lastRush: Date.now(),
                rushDuration: 0,
                patrolTarget: null,
                stuckTimer: 0
            };
        }

        let ghosts = [];
        let lastGhostSpawn = Date.now();

        // Player (ghost in dualHero - faster than human)
        let player = { x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, radius: 12, speed: 360, flashTime: 0, angle: 0 };
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            const code = e.code;

            // Handle key rebinding in keySettings mode
            if (gameState === 'keySettings' && keySettingsState.waitingForKey && keySettingsState.selectingAction) {
                e.preventDefault();
                if (key === 'escape') {
                    keySettingsState.waitingForKey = false;
                    keySettingsState.selectingAction = null;
                } else {
                    // Rebind the key
                    const mode = keySettingsState.mode;
                    const action = keySettingsState.selectingAction;
                    const newKey = (code === 'Space') ? ' ' : key;

                    // Check if key is already bound to another action
                    const bindings = KEY_BINDINGS[mode] || KEY_BINDINGS_CONFIG[mode];
                    for (const [existingAction, binding] of Object.entries(bindings)) {
                        if (binding.key.toLowerCase() === newKey.toLowerCase() && existingAction !== action) {
                            // Swap bindings
                            const oldKey = KEY_BINDINGS[mode][action].key;
                            KEY_BINDINGS[mode][existingAction].key = oldKey;
                        }
                    }

                    // Set the new key
                    if (!KEY_BINDINGS[mode]) KEY_BINDINGS[mode] = {};
                    if (!KEY_BINDINGS[mode][action]) KEY_BINDINGS[mode][action] = { ...KEY_BINDINGS_CONFIG[mode][action] };
                    KEY_BINDINGS[mode][action].key = newKey;

                    keySettingsState.waitingForKey = false;
                    keySettingsState.selectingAction = null;
                    saveKeyBindingsToLocalStorage();
                }
                return;
            }

            // Always update keys unless in build block placing mode
            if (key in keys) keys[key] = true;
            // IJKL for player 2 (dual hero mode)
            if (key in keys2) keys2[key] = true;
            // Sync keys based on KEY_BINDINGS for custom key support
            if (gameState === 'playing') {
                syncKeysForBinding(key, true);
            }
            if (gameState === 'playing') {
                // Track action key state for key remapping system
                const action = getActionForKey(key, { mode: gameMode, player: 1 });
                if (action) {
                    _actionKeyState[action] = true;
                }

                // Dual Hero mode ghost skills
                if (gameMode === 'dualHero') {
                    // Ghost skills (controlled by ghost player - ALWAYS player)

                    // Ghost B key - destroy camera when near one
                    if (key === 'b') {
                        for (let i = surveillanceCameras.length - 1; i >= 0; i--) {
                            const cam = surveillanceCameras[i];
                            const dist = Math.hypot(player.x - cam.x, player.y - cam.y);
                            if (dist < 80) {
                                // Destroy this camera
                                surveillanceCameras.splice(i, 1);
                                if (cameraModeTarget === i) {
                                    cameraModeTarget = surveillanceCameras.length > 0 ? 0 : null;
                                    if (cameraModeTarget === null) cameraModeActive = false;
                                } else if (cameraModeTarget > i) {
                                    cameraModeTarget--;
                                }
                                player.flashTime = Date.now();
                                break;
                            }
                        }
                    }

                    if (key === 'u' && ghostSkills.teleport.cooldown <= 0) {
                        // Teleport flash - teleport in facing direction
                        const ghost = player;
                        const teleportDist = 150;
                        const newX = ghost.x + Math.cos(ghost.angle) * teleportDist;
                        const newY = ghost.y + Math.sin(ghost.angle) * teleportDist;
                        // Check if valid position (not inside wall)
                        if (!isCollidingWithWalls(newX, newY, 24)) {
                            ghost.x = newX;
                            ghost.y = newY;
                        }
                        ghostSkills.teleport.cooldown = ghostSkills.teleport.maxCooldown;
                        ghost.flashTime = Date.now();
                    }
                    // F key - speed boost
                    if (key === 'f' && ghostSpeedBoost > 0 && ghostSpeedBoostCooldown <= 0 && !ghostSpeedBoostActive) {
                        ghostSpeedBoost--;
                        ghostSpeedBoostActive = true;
                        ghostSpeedBoostTimer = GHOST_SPEED_BOOST_DURATION;
                        ghostSpeedBoostCooldown = GHOST_SPEED_BOOST_COOLDOWN;
                        player.flashTime = Date.now();
                    }

        // Active effects from thrown items

        function throwItem() {
            // Find the first throwable item we have
            let throwType = null;
            if (playerThrowables.grenade > 0) {
                throwType = 'grenade';
                playerThrowables.grenade--;
            } else if (playerThrowables.smokeBomb > 0) {
                throwType = 'smokeBomb';
                playerThrowables.smokeBomb--;
            } else if (playerThrowables.banana > 0) {
                throwType = 'banana';
                playerThrowables.banana--;
            }

            if (!throwType) return;

            // Calculate throw direction (toward facing direction)
            const throwAngle = player.angle || 0;
            // Fixed throw distances per type
            const throwDist = throwType === 'grenade' ? 300 : (throwType === 'smokeBomb' ? 400 : 200);
            const targetX = player.x + Math.cos(throwAngle) * throwDist;
            const targetY = player.y + Math.sin(throwAngle) * throwDist;

            // Create thrown item effect
            activeEffects.push({
                type: throwType,
                x: targetX,
                y: targetY,
                startTime: Date.now(),
                duration: throwType === 'grenade' ? 2000 : 5000,
                radius: throwType === 'grenade' ? 100 : (throwType === 'smokeBomb' ? 120 : 30)
            });
        }

        function useSkill(skillType) {
            if (gameState !== 'playing') return;
            const skill = playerSkills[skillType];
            if (!skill) return;
            if (skillCooldowns[skillType] > 0) return;
            if (skill.active) return;

            // Activate skill
            skill.active = true;
            skillCooldowns[skillType] = SKILL_TYPES[skillType].cooldown;

            // Set duration timeout
            setTimeout(() => {
                if (playerSkills[skillType]) {
                    playerSkills[skillType].active = false;
                }
            }, SKILL_TYPES[skillType].duration);

            // Smoke screen creates effect at player location
            if (skillType === 'smokeScreen') {
                activeEffects.push({
                    type: 'smokeScreen',
                    x: player.x,
                    y: player.y,
                    startTime: Date.now(),
                    duration: SKILL_TYPES[skillType].duration,
                    radius: 120,
                    active: true
                });
            }
        }

        function spawnSafeZones() {
            safeZones = [];
            const count = 3 + Math.floor(Math.random() * 3); // 3-5 safe zones
            for (let i = 0; i < count; i++) {
                let attempts = 0;
                let sz;
                do {
                    sz = {
                        x: 150 + Math.random() * (WORLD_WIDTH - 300),
                        y: 150 + Math.random() * (WORLD_HEIGHT - 300),
                        radius: 60 + Math.random() * 20
                    };
                    attempts++;
                } while (attempts < 100 && (isCollidingWithWalls(sz.x, sz.y, sz.radius) || isTooCloseToOtherSafeZone(sz)));

                if (attempts < 100) {
                    safeZones.push(sz);
                }
            }
        }

        function isTooCloseToOtherSafeZone(sz) {
            for (const other of safeZones) {
                if (Math.hypot(sz.x - other.x, sz.y - other.y) < sz.radius + other.radius + 100) {
                    return true;
                }
            }
            return false;
        }

        function isInsideSafeZone(x, y, radius) {

        function drawSafeZones() {
            const now = Date.now();
            safeZones.forEach(sz => {
                const screenX = sz.x - camera.x;
                const screenY = sz.y - camera.y;
                if (screenX < -100 || screenX > canvas.width + 100 ||
                    screenY < -100 || screenY > canvas.height + 100) return;

                // Pulsing glow
                const pulse = 0.6 + Math.sin(now / 400) * 0.15;
                ctx.beginPath();
                ctx.arc(screenX, screenY, sz.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 50, ${0.08 * pulse})`;
                ctx.fill();
                ctx.strokeStyle = `rgba(255, 220, 50, ${0.5 * pulse})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

        function drawMissilePickups() {

            missilePickups.forEach(mp => {

                if (screenX < -50 || screenX > canvas.width + 50 ||
                    screenY < -50 || screenY > canvas.height + 50) return;

                const pulse = 1 + Math.sin(now / 200) * 0.2;
                ctx.beginPath();
                ctx.arc(screenX, screenY, mp.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = '#ff8800';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff8800';
                ctx.fill();
                ctx.shadowBlur = 0;

                // Inner diamond
                ctx.beginPath();
                ctx.moveTo(screenX, screenY - 5);
                ctx.lineTo(screenX + 5, screenY);
                ctx.lineTo(screenX, screenY + 5);
                ctx.lineTo(screenX - 5, screenY);
                ctx.closePath();
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });

        function updateGhostMagnets() {

            const now = Date.now();
            for (let i = activeGhostMagnets.length - 1; i >= 0; i--) {
                const magnet = activeGhostMagnets[i];
                const age = now - magnet.startTime;
                if (age > magnet.duration) {
                    // Explode! Kill ghosts in range
                    const blastRadius = 120;
                    let killed = 0;
                    for (let j = ghosts.length - 1; j >= 0; j--) {
                        if (Math.hypot(ghosts[j].x - magnet.x, ghosts[j].y - magnet.y) < blastRadius) {
                            ghosts.splice(j, 1);
                            killed++;
                        }
                    }
                    mazeGhostsKilled += killed;
                    // Create explosion effect
                    activeEffects.push({
                        type: 'ghostMagnetExplode',
                        x: magnet.x,
                        y: magnet.y,
                        startTime: now,
                        duration: 1500,
                        radius: blastRadius,
                        active: true
                    });
                    activeGhostMagnets.splice(i, 1);
                }
            }
        }

                ctx.fillStyle = '#9933ff';
                ctx.fillRect(screenX - size, screenY - size, size * 2, size * 2);
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#9933ff';
                ctx.fillRect(screenX - size, screenY - size, size * 2, size * 2);
                ctx.shadowBlur = 0;

                // Inner highlight
                ctx.fillStyle = '#cc88ff';
                const inner = size * 0.5;
                ctx.fillRect(screenX - inner, screenY - inner, inner * 2, inner * 2);
            });
        }

        function drawBuildBlockWalls() {
            if (gameMode !== 'mazeEndless') return;
            const now = Date.now();
            buildBlockWalls.forEach(bw => {
                const sx = bw.x - camera.x;
                const sy = bw.y - camera.y;
                if (sx + bw.w > 0 && sx < canvas.width && sy + bw.h > 0 && sy < canvas.height) {
                    const age = (bw.expireTime - now) / 120000;
                    // Fade as it approaches expiration
                    const alpha = 0.4 + age * 0.6;
                    ctx.fillStyle = `rgba(120, 60, 200, ${alpha})`;
                    ctx.fillRect(sx, sy, bw.w, bw.h);
                    ctx.strokeStyle = `rgba(180, 100, 255, ${alpha})`;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx, sy, bw.w, bw.h);
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = `rgba(150, 80, 255, ${alpha})`;
                    ctx.strokeRect(sx, sy, bw.w, bw.h);
                    ctx.shadowBlur = 0;
                }
            });
        }

        function drawActiveGhostMagnets() {
            if (gameMode !== 'mazeEndless') return;
            const now = Date.now();
            activeGhostMagnets.forEach(magnet => {
                const screenX = magnet.x - camera.x;
                const screenY = magnet.y - camera.y;
                if (screenX < -100 || screenX > canvas.width + 100 ||
                    screenY < -100 || screenY > canvas.height + 100) return;

                const age = now - magnet.startTime;
                const progress = age / magnet.duration;
                const pulse = 1 + Math.sin(now / 100) * 0.3;
                const size = 16 * pulse;

                // Pulsing gray square with attraction rings
                ctx.fillStyle = '#666666';
                ctx.fillRect(screenX - size, screenY - size, size * 2, size * 2);
                ctx.strokeStyle = '#aaaaaa';
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX - size, screenY - size, size * 2, size * 2);

                // Attraction range indicator
                ctx.beginPath();
                ctx.arc(screenX, screenY, 120 * (0.5 + progress * 0.5), 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(136, 136, 136, ${0.3 * (1 - progress)})`;
                ctx.stroke();
            });
        }

        function drawFogOfWar() {
            if (gameMode !== 'mazeEndless' || !fogCtx) return;

            const playerScreenX = player.x - camera.x;
            const playerScreenY = player.y - camera.y;

            // Fill fog with dark
            fogCtx.fillStyle = 'rgba(0, 0, 0, 0.95)';
            fogCtx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);

            // Cut out sector vision
            fogCtx.globalCompositeOperation = 'destination-out';

            // Sector (fan-shaped vision) - HALF CIRCLE
            const halfAngle = Math.PI; // 180 degrees (semicircle)
            const visionRange = 400;
            const startAngle = player.angle - halfAngle;
            const endAngle = player.angle + halfAngle;

            fogCtx.beginPath();
            fogCtx.moveTo(playerScreenX, playerScreenY);
            fogCtx.arc(playerScreenX, playerScreenY, visionRange, startAngle, endAngle);
            fogCtx.closePath();
            fogCtx.fillStyle = 'rgba(0, 0, 0, 1)';
            fogCtx.fill();

            // Small circle around player (self-visible)
            fogCtx.beginPath();
            fogCtx.arc(playerScreenX, playerScreenY, 30, 0, Math.PI * 2);
            fogCtx.fillStyle = 'rgba(0, 0, 0, 1)';
            fogCtx.fill();

            // Safe zone glow (visible through fog)
            safeZones.forEach(sz => {
                const szScreenX = sz.x - camera.x;
                const szScreenY = sz.y - camera.y;
                fogCtx.beginPath();
                fogCtx.arc(szScreenX, szScreenY, sz.radius * 0.5, 0, Math.PI * 2);
                fogCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                fogCtx.fill();
            });

            // Active ghost magnets (visible through fog)
            activeGhostMagnets.forEach(magnet => {
                const mgScreenX = magnet.x - camera.x;
                const mgScreenY = magnet.y - camera.y;
                fogCtx.beginPath();
                fogCtx.arc(mgScreenX, mgScreenY, 30, 0, Math.PI * 2);
                fogCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                fogCtx.fill();
            });

            fogCtx.globalCompositeOperation = 'source-over';

            // Draw fog to main canvas
            ctx.drawImage(fogCanvas, 0, 0);
        }

        function drawMissileOverlay() {
            if (gameMode !== 'mazeEndless' || !missileState.active) return;

            const overlayW = 300, overlayH = 225;
            const overlayX = canvas.width - overlayW - 10;
            const overlayY = 10;

            // Background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(overlayX, overlayY, overlayW, overlayH);
            ctx.strokeStyle = '#ff8800';
            ctx.lineWidth = 2;
            ctx.strokeRect(overlayX, overlayY, overlayW, overlayH);

            // Scale
            const scaleX = overlayW / WORLD_WIDTH;
            const scaleY = overlayH / WORLD_HEIGHT;

            // Draw walls
            ctx.fillStyle = '#334466';
            walls.forEach(w => {
                ctx.fillRect(overlayX + w.x * scaleX, overlayY + w.y * scaleY, w.w * scaleX, w.h * scaleY);
            });

            // Draw build block walls
            buildBlockWalls.forEach(bw => {
                ctx.fillStyle = 'rgba(120, 60, 200, 0.8)';
                ctx.fillRect(overlayX + bw.x * scaleX, overlayY + bw.y * scaleY, bw.w * scaleX, bw.h * scaleY);
            });

            // Draw active ghost magnets
            activeGhostMagnets.forEach(magnet => {
                ctx.beginPath();
                ctx.arc(overlayX + magnet.x * scaleX, overlayY + magnet.y * scaleY, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#888888';
                ctx.fill();
            });

            // Draw safe zones
            safeZones.forEach(sz => {
                ctx.beginPath();
                ctx.arc(overlayX + sz.x * scaleX, overlayY + sz.y * scaleY, sz.radius * scaleX, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 220, 50, 0.3)';
                ctx.fill();
            });

            // Draw ghosts as red dots
            ghosts.forEach(ghost => {
                ctx.beginPath();
                ctx.arc(overlayX + ghost.x * scaleX, overlayY + ghost.y * scaleY, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0000';
                ctx.fill();
            });

            // Draw player
            ctx.beginPath();
            ctx.arc(overlayX + player.x * scaleX, overlayY + player.y * scaleY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Crosshair
            const chX = overlayX + missileState.crosshairX * scaleX;
            const chY = overlayY + missileState.crosshairY * scaleY;

            // Crosshair outer circle
            ctx.beginPath();
            ctx.arc(chX, chY, 10, 0, Math.PI * 2);
            ctx.strokeStyle = '#ff8800';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Crosshair inner circle
            ctx.beginPath();
            ctx.arc(chX, chY, 4, 0, Math.PI * 2);
            ctx.strokeStyle = '#ff8800';
            ctx.stroke();

            // Crosshair cross lines
            ctx.beginPath();
            ctx.moveTo(chX - 14, chY);
            ctx.lineTo(chX + 14, chY);
            ctx.moveTo(chX, chY - 14);
            ctx.lineTo(chX, chY + 14);
            ctx.strokeStyle = '#ff8800';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Blast radius indicator
            const blastRadius = 80 * scaleX;
            ctx.beginPath();
            ctx.arc(chX, chY, blastRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 136, 0, 0.5)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Label
            ctx.fillStyle = '#ff8800';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('WASD移动准心 | 空格发射 | ESC取消', overlayX + overlayW / 2, overlayY + overlayH + 15);
        }

        function fireMissile() {
            const blastRadius = 80;
            let killed = 0;
            for (let i = ghosts.length - 1; i >= 0; i--) {
                if (Math.hypot(ghosts[i].x - missileState.crosshairX, ghosts[i].y - missileState.crosshairY) < blastRadius) {
                    ghosts.splice(i, 1);
                    killed++;
                }
            }
            mazeGhostsKilled += killed;
            playerMissiles--;

            // Create explosion effect
            activeEffects.push({
                type: 'missile',
                x: missileState.crosshairX,
                y: missileState.crosshairY,
                startTime: Date.now(),
                duration: 1500,
                radius: blastRadius,
                active: true
            });

            missileState.active = false;
        }

        function updateSkillCooldowns(dt) {
            for (const skillType in skillCooldowns) {
                if (skillCooldowns[skillType] > 0) {
                    skillCooldowns[skillType] -= dt * 1000;
                    if (skillCooldowns[skillType] < 0) skillCooldowns[skillType] = 0;
                }
            }
            // Update blindfold timer
            if (blindfoldCooldown > 0) blindfoldCooldown -= dt * 1000;
            if (blindfoldActive) {
                blindfoldTimer -= dt * 1000;
                if (blindfoldTimer <= 0) {
                    blindfoldActive = false;
                    blindfoldTimer = 0;
                }
            }
            // Update speed boost timer
            if (ghostSpeedBoostCooldown > 0) ghostSpeedBoostCooldown -= dt * 1000;
            if (ghostSpeedBoostActive) {
                ghostSpeedBoostTimer -= dt * 1000;
                if (ghostSpeedBoostTimer <= 0) {
                    ghostSpeedBoostActive = false;
                    ghostSpeedBoostTimer = 0;
                }
            }
        }

        function spawnCooldownOrbs() {
            cooldownOrbs = [];
            for (let i = 0; i < 5; i++) {
                cooldownOrbs.push({
                    ...createRandomPosition(),
                    radius: 12,
                    lastCollected: -COOLDOWN_ORB_DURATION
                });
            }
        }

        function spawnThrowableItems() {
            throwableItems = [];
            const types = ['grenade', 'smokeBomb', 'banana'];
            for (let i = 0; i < 6; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                throwableItems.push({
                    ...createRandomPosition(),
                    type: type,
                    radius: THROWABLE_TYPES[type].radius
                });
            }
        }

        function spawnMoreItems() {
            for (let i = 0; i < ITEMS_PER_SPAWN; i++) {
                items.push(createRandomPosition());
            }
            // Also spawn more throwable items
            const types = ['grenade', 'smokeBomb', 'banana'];
            for (let i = 0; i < 2; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                throwableItems.push({
                    ...createRandomPosition(),
                    type: type,
                    radius: THROWABLE_TYPES[type].radius
                });
            }
            // Respawn skill orbs
            if (skillOrbs.length < 4) {
                const skillTypes = ['speedBoost', 'invisibility', 'smokeScreen'];
                for (let i = 0; i < 2; i++) {
                    const type = skillTypes[Math.floor(Math.random() * skillTypes.length)];
                    skillOrbs.push({
                        ...createRandomPosition(),
                        type: type,
                        radius: 14
                    });
                }
            }
        }

        function createRandomPosition() {
            let pos;
            let attempts = 0;
            do {
                pos = {
                    x: 80 + Math.random() * (WORLD_WIDTH - 160),
                    y: 80 + Math.random() * (WORLD_HEIGHT - 160)
                };
                attempts++;
            } while (attempts < 100 && isCollidingWithWalls(pos.x, pos.y, 15));
            return pos;
        }

        function isCollidingWithWalls(x, y, radius) {
            for (const w of walls) {
                if (x + radius > w.x && x - radius < w.x + w.w &&
                    y + radius > w.y && y - radius < w.y + w.h) {
                    return true;
                }
            }
            // Also check build block walls
            if (gameMode === 'mazeEndless') {
                for (const bw of buildBlockWalls) {
                    if (x + radius > bw.x && x - radius < bw.x + bw.w &&
                        y + radius > bw.y && y - radius < bw.y + bw.h) {
                        return true;
                    }
                }
            }
            return false;
        }

        function circleCollision(x1, y1, r1, x2, y2, r2) {
            return Math.hypot(x2 - x1, y2 - y1) < r1 + r2;
        }

        function updateCamera() {
            // Camera follows player, centered
            let targetX = player.x - canvas.width / 2;
            let targetY = player.y - canvas.height / 2;

            // Clamp to world bounds
            camera.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, targetX));
            camera.y = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, targetY));
        }

        function updatePlayer(dt) {
            // Missile mode: freeze player, update crosshair and cooldowns
            if (gameMode === 'mazeEndless' && missileState.active) {
                updateSkillCooldowns(dt);
                // Move crosshair with WASD
                let cdx = 0, cdy = 0;
                if (keys.w) cdy -= 1;
                if (keys.s) cdy += 1;
                if (keys.a) cdx -= 1;
                if (keys.d) cdx += 1;
                if (cdx !== 0 && cdy !== 0) { cdx *= 0.707; cdy *= 0.707; }
                missileState.crosshairX += cdx * missileState.crosshairSpeed * dt;
                missileState.crosshairY += cdy * missileState.crosshairSpeed * dt;
                missileState.crosshairX = Math.max(30, Math.min(WORLD_WIDTH - 30, missileState.crosshairX));
                missileState.crosshairY = Math.max(30, Math.min(WORLD_HEIGHT - 30, missileState.crosshairY));
                return;
            }

            let dx = 0, dy = 0;
            if (keys.w) dy -= 1;
            if (keys.s) dy += 1;
            if (keys.a) dx -= 1;
            if (keys.d) dx += 1;

            // Update player facing angle based on movement
            if (dx !== 0 || dy !== 0) {
                player.angle = Math.atan2(dy, dx);
            }

            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }

            // Speed boost skill
            let speed = player.speed;
            if (playerSkills.speedBoost && playerSkills.speedBoost.active) {
                speed *= 2;
            }
            // Ghost speed boost item
            if (ghostSpeedBoostActive) {
                speed *= 1.8;
            }

            // Check banana slip effect
            let actualSpeed = speed;
            for (const effect of activeEffects) {
                if (effect.type === 'banana' && effect.active) {
                    if (circleCollision(player.x, player.y, player.radius, effect.x, effect.y, 30)) {
                        actualSpeed *= 0.3;
                        break;
                    }
                }
            }

            let newX = player.x + dx * actualSpeed * dt;
            let newY = player.y + dy * actualSpeed * dt;

            // Clamp to world bounds
            newX = Math.max(30, Math.min(WORLD_WIDTH - 30, newX));
            newY = Math.max(30, Math.min(WORLD_HEIGHT - 30, newY));

            if (!isCollidingWithWalls(newX, player.y, player.radius)) {
                player.x = newX;
            }
            if (!isCollidingWithWalls(player.x, newY, player.radius)) {
                player.y = newY;
            }

            // Check item collection
            for (let i = items.length - 1; i >= 0; i--) {
                if (circleCollision(player.x, player.y, player.radius, items[i].x, items[i].y, 10)) {
                    items.splice(i, 1);
                    collectedCount++;
                    totalCollected++;
                    player.flashTime = Date.now();

                    // Spawn more items every ITEMS_PER_SPAWN collected
                    if (totalCollected % ITEMS_PER_SPAWN === 0 && totalCollected < ITEMS_TO_WIN) {
                        spawnMoreItems();
                    }

                    if (collectedCount >= ITEMS_TO_WIN) {
                        exit.active = true;
                    }
                }
            }

            // Check cooldown orb collection
            const now = Date.now();
            cooldownOrbs.forEach(orb => {
                if (circleCollision(player.x, player.y, player.radius, orb.x, orb.y, orb.radius)) {
                    if (now - orb.lastCollected > COOLDOWN_ORB_DURATION) {
                        // Reduce all skill cooldowns by 10 seconds
                        for (const skillType in skillCooldowns) {
                            skillCooldowns[skillType] = Math.max(0, skillCooldowns[skillType] - 10000);
                        }
                        orb.lastCollected = now;
                        player.flashTime = now;
                    }
                }
            });

            // Check skill orb collection
            for (let i = skillOrbs.length - 1; i >= 0; i--) {
                const orb = skillOrbs[i];
                if (circleCollision(player.x, player.y, player.radius, orb.x, orb.y, orb.radius)) {
                    // Assign skill to player (overwrite if already has this skill)
                    playerSkills[orb.type] = { active: false };
                    skillOrbs.splice(i, 1);
                    player.flashTime = now;
                }
            }

            // Check throwable item collection
            for (let i = throwableItems.length - 1; i >= 0; i--) {
                const t = throwableItems[i];
                if (circleCollision(player.x, player.y, player.radius, t.x, t.y, t.radius)) {
                    playerThrowables[t.type]++;
                    throwableItems.splice(i, 1);
                    player.flashTime = now;
                }
            }

            // Check missile pickup collection (maze mode)
            if (gameMode === 'mazeEndless') {
                for (let i = missilePickups.length - 1; i >= 0; i--) {
                    const mp = missilePickups[i];
                    if (circleCollision(player.x, player.y, player.radius, mp.x, mp.y, mp.radius)) {
                        playerMissiles++;
                        missilePickups.splice(i, 1);
                        player.flashTime = now;
                    }
                }
                // Check build block pickup collection
                for (let i = buildBlockPickups.length - 1; i >= 0; i--) {
                    const bp = buildBlockPickups[i];
                    if (circleCollision(player.x, player.y, player.radius, bp.x, bp.y, bp.radius)) {
                        playerBuildBlocks += 5;
                        buildBlockPickups.splice(i, 1);
                        player.flashTime = now;
                    }
                }
                // Check ghost magnet pickup collection
                for (let i = ghostMagnetPickups.length - 1; i >= 0; i--) {
                    const gm = ghostMagnetPickups[i];
                    if (circleCollision(player.x, player.y, player.radius, gm.x, gm.y, gm.radius)) {
                        playerGhostMagnets++;
                        ghostMagnetPickups.splice(i, 1);
                        player.flashTime = now;
                    }
                }
                // Collect beans (items in maze mode are beans)
                for (let i = items.length - 1; i >= 0; i--) {
                    if (circleCollision(player.x, player.y, player.radius, items[i].x, items[i].y, 10)) {
                        items.splice(i, 1);
                        mazeBeansCollected++;
                        player.flashTime = now;
                        // Spawn more beans
                        items.push(createRandomPosition());
                    }
                }

                // Collect blindfold pickups
                for (let i = blindfoldPickups.length - 1; i >= 0; i--) {
                    if (circleCollision(player.x, player.y, player.radius, blindfoldPickups[i].x, blindfoldPickups[i].y, 12)) {
                        blindfoldPickups.splice(i, 1);
                        playerBlindfolds++;
                        player.flashTime = now;
                        blindfoldPickups.push(createRandomPosition());
                    }
                }

                // Collect camera pickups (just adds to inventory, doesn't place directly)
                for (let i = cameraPickups.length - 1; i >= 0; i--) {
                    if (cameraPickups[i] && circleCollision(player.x, player.y, player.radius, cameraPickups[i].x, cameraPickups[i].y, 12)) {
                        const newPos = createRandomPosition();
                        cameraPickups.splice(i, 1);
                        playerCameras++; // Just add to inventory
                        player.flashTime = now;
                        if (newPos) {
                            cameraPickups.push(newPos);
                        }
                    }
                }

                // Collect speed boost pickups
                for (let i = speedBoostPickups.length - 1; i >= 0; i--) {
                    if (circleCollision(player.x, player.y, player.radius, speedBoostPickups[i].x, speedBoostPickups[i].y, 12)) {
                        speedBoostPickups.splice(i, 1);
                        ghostSpeedBoost++;
                        player.flashTime = now;
                        speedBoostPickups.push(createRandomPosition());
                    }
                }
            }

            // Check exit
            if (exit.active && circleCollision(player.x, player.y, player.radius, exit.x, exit.y, 25)) {
                gameState = 'gameover';
                gameResult = 'win';
            }

            // Update skill cooldowns
            updateSkillCooldowns(dt);
        }

        function drawPlayer() {
            const screenX = player.x - camera.x;
            const screenY = player.y - camera.y;

            // In dual hero mode, player is ALWAYS the ghost (red)
            let color = COLORS.player;
            if (gameMode === 'dualHero') {
                color = '#ff3333';
            }

            ctx.beginPath();
            ctx.arc(screenX, screenY, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.shadowBlur = 25;
            ctx.shadowColor = color;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Direction indicator
            const dirX = screenX + Math.cos(player.angle) * (player.radius + 8);
            const dirY = screenY + Math.sin(player.angle) * (player.radius + 8);
            ctx.beginPath();
            ctx.moveTo(screenX + Math.cos(player.angle) * player.radius, screenY + Math.sin(player.angle) * player.radius);
            ctx.lineTo(dirX, dirY);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();

            if (player.flashTime && Date.now() - player.flashTime < 200) {
                ctx.beginPath();
                ctx.arc(screenX, screenY, player.radius + 12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
                ctx.fill();
            }
        }

        function drawPlayer2() {
            if (gameMode !== 'dualHero') return;
            const screenX = player2.x - camera.x;
            const screenY = player2.y - camera.y;

            // Player 2 is ALWAYS the human (white) in dualHero mode
            const color = '#ffffff';

            ctx.beginPath();
            ctx.arc(screenX, screenY, player2.radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.shadowBlur = 25;
            ctx.shadowColor = color;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Direction indicator
            const dirX = screenX + Math.cos(player2.angle) * (player2.radius + 8);
            const dirY = screenY + Math.sin(player2.angle) * (player2.radius + 8);
            ctx.beginPath();
            ctx.moveTo(screenX + Math.cos(player2.angle) * player2.radius, screenY + Math.sin(player2.angle) * player2.radius);
            ctx.lineTo(dirX, dirY);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();

            if (player2.flashTime && Date.now() - player2.flashTime < 200) {
                ctx.beginPath();
                ctx.arc(screenX, screenY, player2.radius + 12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
                ctx.fill();
            }
        }

        function drawGhostTraps() {
            if (gameMode !== 'dualHero') return;
            const now = Date.now();
            ghostTraps.forEach(trap => {
                const sx = trap.x - camera.x;
                const sy = trap.y - camera.y;
                if (sx < -50 || sx > canvas.width + 50 || sy < -50 || sy > canvas.height + 50) return;

                const pulse = 1 + Math.sin(now / 150) * 0.3;
                // Trap circle
                ctx.beginPath();
                ctx.arc(sx, sy, trap.radius * pulse, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 100, 100, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 50, 50, 0.15)';
                ctx.fill();

                // Inner pattern
                ctx.beginPath();
                ctx.arc(sx, sy, trap.radius * 0.5 * pulse, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 100, 100, 0.4)';
                ctx.stroke();
            });
        }

        function drawGhostTracker() {
            if (gameMode !== 'dualHero' || !ghostTrackerActive) return;
            const now = Date.now();

        // Draw surveillance camera bullets (visible to both ghost and human)
        function drawSurveillanceBullets() {
            if (gameMode !== 'dualHero') return;
            const now = Date.now();

            surveillanceCameras.forEach(cam => {
                // Draw bullets from this camera
                if (cam.shootTime && now - cam.shootTime < 2000) {
                    const bulletSpeed = 500;
                    const maxDist = bulletSpeed * (now - cam.shootTime) / 1000;

                    // Calculate bullet position with wall reflection
                    let bulletX = cam.x;
                    let bulletY = cam.y;
                    let dx = cam.bulletDx;
                    let dy = cam.bulletDy;
                    let remainingDist = maxDist;

                    for (let bounce = 0; bounce < 5 && remainingDist > 0; bounce++) {
                        let nearestDist = remainingDist;
                        let hitWall = null;
                        let hitPoint = null;

                        for (const w of walls) {
                            const wallLines = [
                                { x1: w.x, y1: w.y, x2: w.x + w.w, y2: w.y, normal: { x: 0, y: -1 } },
                                { x1: w.x, y1: w.y + w.h, x2: w.x + w.w, y2: w.y + w.h, normal: { x: 0, y: 1 } },
                                { x1: w.x, y1: w.y, x2: w.x, y2: w.y + w.h, normal: { x: -1, y: 0 } },
                                { x1: w.x + w.w, y1: w.y, x2: w.x + w.w, y2: w.y + w.h, normal: { x: 1, y: 0 } }
                            ];

                            for (const wall of wallLines) {
                                const denom = dx * wall.normal.x + dy * wall.normal.y;
                                if (Math.abs(denom) < 0.001) continue;

                                const t = ((wall.x1 - bulletX) * wall.normal.x + (wall.y1 - bulletY) * wall.normal.y) / denom;
                                if (t <= 0 || t >= nearestDist) continue;

                                const hitX = bulletX + dx * t;
                                const hitY = bulletY + dy * t;

                                if (hitX >= Math.min(wall.x1, wall.x2) - 1 && hitX <= Math.max(wall.x1, wall.x2) + 1 &&
                                    hitY >= Math.min(wall.y1, wall.y2) - 1 && hitY <= Math.max(wall.y1, wall.y2) + 1) {
                                    nearestDist = t;
                                    hitWall = wall;
                                    hitPoint = { x: hitX, y: hitY };
                                }
                            }
                        }

                        if (hitWall && hitPoint) {
                            bulletX = hitPoint.x;
                            bulletY = hitPoint.y;
                            remainingDist -= nearestDist;
                            const dot = dx * hitWall.normal.x + dy * hitWall.normal.y;
                            dx = dx - 2 * dot * hitWall.normal.x;
                            dy = dy - 2 * dot * hitWall.normal.y;
                        } else {
                            bulletX += dx * remainingDist;
                            bulletY += dy * remainingDist;
                            remainingDist = 0;
                        }
                    }

                    // Draw bullet on screen
                    const screenX = bulletX - camera.x;
                    const screenY = bulletY - camera.y;
                    if (screenX >= -50 && screenX <= canvas.width + 50 &&
                        screenY >= -50 && screenY <= canvas.height + 50) {
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, 6, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffff00';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#ffff00';
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            });
        }
