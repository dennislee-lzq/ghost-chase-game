<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鬼抓人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #16213e;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameState = 'menu';
        let lastTime = 0;
        let gameResult = '';

        // Map settings - large world
        const WORLD_WIDTH = 3200;
        const WORLD_HEIGHT = 2400;
        const ITEMS_TO_WIN = 20;
        const ITEMS_PER_SPAWN = 5;

        // Minimap settings
        const MINIMAP_WIDTH = 180;
        const MINIMAP_HEIGHT = 135;
        const MINIMAP_X = 10;
        const MINIMAP_Y = 10;

        // Cooldown orb settings
        let cooldownOrbs = [];
        const COOLDOWN_ORB_DURATION = 30000; // 30 seconds until respawn

        // Camera
        let camera = { x: 0, y: 0 };

        // Colors
        const COLORS = {
            background: '#1a1a2e',
            wall: '#16213e',
            player: '#ffffff',
            ghost: 'rgba(255, 0, 0, 0.8)',
            item: '#ffd700',
            exitInactive: '#555555',
            exitActive: '#00ff00',
            alertZone: 'rgba(255, 50, 50, 0.15)',
            cooldownOrb: '#00ffff',
            teleportTarget: 'rgba(255, 100, 100, 0.6)'
        };

        function createGhost(x, y) {
            return {
                x: x,
                y: y,
                radius: 18,
                speed: 145,
                alertRange: 280,
                angle: 0,
                mode: 'patrol',
                lastTeleport: Date.now(),
                lastRush: Date.now(),
                rushDuration: 0,
                patrolTarget: null,
                stuckTimer: 0
            };
        }

        let ghosts = [];
        let lastGhostSpawn = Date.now();

        // Player
        let player = { x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, radius: 12, speed: 160, flashTime: 0 };
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (e.code === 'Space' && gameState === 'playing' && selectedItem) {
                useItem();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        // Map generation
        let walls = [];
        let items = [];
        let exit = { x: 0, y: 0, active: false };
        let collectedCount = 0;
        let totalCollected = 0;

        function generateMap() {
            walls = [];
            items = [];
            collectedCount = 0;
            totalCollected = 0;
            exit.active = false;

            // Border walls
            walls.push({ x: 0, y: 0, w: WORLD_WIDTH, h: 30 });
            walls.push({ x: 0, y: WORLD_HEIGHT - 30, w: WORLD_WIDTH, h: 30 });
            walls.push({ x: 0, y: 0, w: 30, h: WORLD_HEIGHT });
            walls.push({ x: WORLD_WIDTH - 30, y: 0, w: 30, h: WORLD_HEIGHT });

            // Many interior walls for maze-like structure
            const numWalls = 40 + Math.floor(Math.random() * 20);
            for (let i = 0; i < numWalls; i++) {
                const horizontal = Math.random() > 0.5;
                if (horizontal) {
                    const y = 100 + Math.random() * (WORLD_HEIGHT - 200);
                    const x = 50 + Math.random() * (WORLD_WIDTH - 300);
                    const w = 80 + Math.random() * 200;
                    walls.push({ x, y, w, h: 20 });
                } else {
                    const x = 50 + Math.random() * (WORLD_WIDTH - 200);
                    const y = 100 + Math.random() * (WORLD_HEIGHT - 300);
                    const h = 80 + Math.random() * 200;
                    walls.push({ x, y, w: 20, h });
                }
            }

            // Generate initial items spread across map
            for (let i = 0; i < 25; i++) {
                items.push(createRandomPosition());
            }

            // Exit at far corner from player start
            exit = { x: WORLD_WIDTH - 100, y: WORLD_HEIGHT - 100, active: false };

            // Spawn cooldown orbs
            spawnCooldownOrbs();
        }

        function spawnCooldownOrbs() {
            cooldownOrbs = [];
            for (let i = 0; i < 5; i++) {
                cooldownOrbs.push({
                    ...createRandomPosition(),
                    radius: 12,
                    lastCollected: -COOLDOWN_ORB_DURATION
                });
            }
        }

        function spawnMoreItems() {
            for (let i = 0; i < ITEMS_PER_SPAWN; i++) {
                items.push(createRandomPosition());
            }
        }

        function createRandomPosition() {
            let pos;
            let attempts = 0;
            do {
                pos = {
                    x: 80 + Math.random() * (WORLD_WIDTH - 160),
                    y: 80 + Math.random() * (WORLD_HEIGHT - 160)
                };
                attempts++;
            } while (attempts < 100 && isCollidingWithWalls(pos.x, pos.y, 15));
            return pos;
        }

        function isCollidingWithWalls(x, y, radius) {
            for (const w of walls) {
                if (x + radius > w.x && x - radius < w.x + w.w &&
                    y + radius > w.y && y - radius < w.y + w.h) {
                    return true;
                }
            }
            return false;
        }

        function circleCollision(x1, y1, r1, x2, y2, r2) {
            return Math.hypot(x2 - x1, y2 - y1) < r1 + r2;
        }

        function updateCamera() {
            // Camera follows player, centered
            let targetX = player.x - canvas.width / 2;
            let targetY = player.y - canvas.height / 2;

            // Clamp to world bounds
            camera.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, targetX));
            camera.y = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, targetY));
        }

        function updatePlayer(dt) {
            let dx = 0, dy = 0;
            if (keys.w) dy -= 1;
            if (keys.s) dy += 1;
            if (keys.a) dx -= 1;
            if (keys.d) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }

            const speed = selectedItem && selectedItem.active && selectedItem.name === '加速药水'
                ? player.speed * 2 : player.speed;

            let newX = player.x + dx * speed * dt;
            let newY = player.y + dy * speed * dt;

            // Clamp to world bounds
            newX = Math.max(30, Math.min(WORLD_WIDTH - 30, newX));
            newY = Math.max(30, Math.min(WORLD_HEIGHT - 30, newY));

            if (!isCollidingWithWalls(newX, player.y, player.radius)) {
                player.x = newX;
            }
            if (!isCollidingWithWalls(player.x, newY, player.radius)) {
                player.y = newY;
            }

            // Check item collection
            for (let i = items.length - 1; i >= 0; i--) {
                if (circleCollision(player.x, player.y, player.radius, items[i].x, items[i].y, 10)) {
                    items.splice(i, 1);
                    collectedCount++;
                    totalCollected++;
                    player.flashTime = Date.now();

                    // Spawn more items every ITEMS_PER_SPAWN collected
                    if (totalCollected % ITEMS_PER_SPAWN === 0 && totalCollected < ITEMS_TO_WIN) {
                        spawnMoreItems();
                    }

                    if (collectedCount >= ITEMS_TO_WIN) {
                        exit.active = true;
                    }
                }
            }

            // Check cooldown orb collection
            const now = Date.now();
            cooldownOrbs.forEach(orb => {
                if (circleCollision(player.x, player.y, player.radius, orb.x, orb.y, orb.radius)) {
                    if (now - orb.lastCollected > COOLDOWN_ORB_DURATION) {
                        // Reduce item cooldowns by 10 seconds
                        if (selectedItem && selectedItem.cooldown > 0) {
                            selectedItem.cooldown = Math.max(0, selectedItem.cooldown - 10000);
                        }
                        orb.lastCollected = now;
                        player.flashTime = now;
                    }
                }
            });

            // Check exit
            if (exit.active && circleCollision(player.x, player.y, player.radius, exit.x, exit.y, 25)) {
                gameState = 'gameover';
                gameResult = 'win';
            }

            // Update item cooldown
            if (selectedItem && selectedItem.cooldown > 0) {
                selectedItem.cooldown -= dt * 1000;
                if (selectedItem.cooldown < 0) selectedItem.cooldown = 0;
            }
        }

        function drawPlayer() {
            ctx.beginPath();
            ctx.arc(player.x - camera.x, player.y - camera.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.player;
            ctx.fill();
            ctx.shadowBlur = 25;
            ctx.shadowColor = COLORS.player;
            ctx.fill();
            ctx.shadowBlur = 0;

            if (player.flashTime && Date.now() - player.flashTime < 200) {
                ctx.beginPath();
                ctx.arc(player.x - camera.x, player.y - camera.y, player.radius + 12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
                ctx.fill();
            }
        }

        function updateGhosts(dt) {
            // Spawn new ghost every 20 seconds, max 3 ghosts
            if (Date.now() - lastGhostSpawn > 20000 && ghosts.length < 3) {
                const corners = [
                    { x: 100, y: 100 },
                    { x: WORLD_WIDTH - 100, y: 100 },
                    { x: 100, y: WORLD_HEIGHT - 100 },
                    { x: WORLD_WIDTH - 100, y: WORLD_HEIGHT - 100 }
                ];
                const corner = corners[Math.floor(Math.random() * corners.length)];
                ghosts.push(createGhost(corner.x, corner.y));
                lastGhostSpawn = Date.now();
            }

            ghosts.forEach(ghost => {
                const distToPlayer = Math.hypot(player.x - ghost.x, player.y - ghost.y);
                const angleToPlayer = Math.atan2(player.y - ghost.y, player.x - ghost.x);

                // Check if in smoke
                let inSmoke = false;
                for (const smoke of smokeBombs) {
                    const age = Date.now() - smoke.startTime;
                    if (age < smoke.duration && Math.hypot(player.x - smoke.x, player.y - smoke.y) < smoke.radius) {
                        inSmoke = true;
                        break;
                    }
                }

                // Check invisibility
                const isInvisible = selectedItem && selectedItem.active && selectedItem.name === '隐身药水';

                // If in alert range and not invisible, ALWAYS chase (no patrol)
                const inAlertRange = distToPlayer < ghost.alertRange && !isInvisible && !inSmoke;
                ghost.mode = inAlertRange ? 'chase' : 'patrol';

                let currentSpeed = ghost.speed;

                if (ghost.rushDuration > 0) {
                    ghost.rushDuration -= dt * 1000;
                    currentSpeed *= 1.8;
                }

                if (ghost.mode === 'chase') {
                    // Direct chase toward player
                    const dx = Math.cos(angleToPlayer) * currentSpeed * dt;
                    const dy = Math.sin(angleToPlayer) * currentSpeed * dt;

                    if (!moveGhostWithCollision(ghost, dx, dy)) {
                        // Stuck - teleport to player vicinity
                        teleportGhostNearPlayer(ghost);
                    }
                    ghost.angle = angleToPlayer;

                    // Rush skill more often in chase
                    if (Date.now() - ghost.lastRush > 12000 && ghost.rushDuration <= 0) {
                        ghost.rushDuration = 2000;
                        ghost.lastRush = Date.now();
                    }
                } else {
                    // Patrol - wander
                    if (!ghost.patrolTarget || Math.hypot(ghost.patrolTarget.x - ghost.x, ghost.patrolTarget.y - ghost.y) < 20) {
                        ghost.patrolTarget = {
                            x: 100 + Math.random() * (WORLD_WIDTH - 200),
                            y: 100 + Math.random() * (WORLD_HEIGHT - 200)
                        };
                    }
                    const angleToTarget = Math.atan2(ghost.patrolTarget.y - ghost.y, ghost.patrolTarget.x - ghost.x);
                    ghost.angle = angleToTarget;
                    const dx = Math.cos(angleToTarget) * currentSpeed * 0.6 * dt;
                    const dy = Math.sin(angleToTarget) * currentSpeed * 0.6 * dt;
                    moveGhostWithCollision(ghost, dx, dy);

                    // Teleport every 15 seconds in patrol
                    if (Date.now() - ghost.lastTeleport > 20000) {
                        teleportGhostNearPlayer(ghost);
                    }
                }

                // Check if caught player
                if (circleCollision(player.x, player.y, player.radius, ghost.x, ghost.y, ghost.radius)) {
                    gameState = 'gameover';
                    gameResult = 'lose';
                }
            });
        }

        function moveGhostWithCollision(ghost, dx, dy) {
            let moved = false;
            if (!isCollidingWithWalls(ghost.x + dx, ghost.y + dy, ghost.radius)) {
                ghost.x += dx;
                ghost.y += dy;
                moved = true;
            } else if (!isCollidingWithWalls(ghost.x + dx, ghost.y, ghost.radius)) {
                ghost.x += dx;
                moved = true;
            } else if (!isCollidingWithWalls(ghost.x, ghost.y + dy, ghost.radius)) {
                ghost.y += dy;
                moved = true;
            }
            return moved;
        }

        function teleportGhostNearPlayer(ghost) {
            // Teleport randomly in the world, not near player
            let newX, newY;
            let attempts = 0;
            do {
                newX = 100 + Math.random() * (WORLD_WIDTH - 200);
                newY = 100 + Math.random() * (WORLD_HEIGHT - 200);
                attempts++;
            } while (attempts < 50 && isCollidingWithWalls(newX, newY, ghost.radius));

            if (!isCollidingWithWalls(newX, newY, ghost.radius)) {
                ghost.x = newX;
                ghost.y = newY;
                ghost.lastTeleport = Date.now();
            }
        }

        function drawGhosts() {
            ghosts.forEach(ghost => {
                const screenX = ghost.x - camera.x;
                const screenY = ghost.y - camera.y;

                // Only draw if on screen
                if (screenX < -100 || screenX > canvas.width + 100 ||
                    screenY < -100 || screenY > canvas.height + 100) return;

                // Alert zone (red area)
                ctx.beginPath();
                ctx.arc(screenX, screenY, ghost.alertRange, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.alertZone;
                ctx.fill();

                // Ghost body with pulse
                const pulse = 1 + Math.sin(Date.now() / 150) * 0.15;
                ctx.beginPath();
                ctx.arc(screenX, screenY, ghost.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = ghost.mode === 'chase' ? '#ff2222' : COLORS.ghost;
                ctx.fill();
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ff0000';
                ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes
                const eyeOffset = 6;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(screenX - eyeOffset, screenY - 4, 4, 0, Math.PI * 2);
                ctx.arc(screenX + eyeOffset, screenY - 4, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSmokeBombs() {
            const now = Date.now();
            for (let i = smokeBombs.length - 1; i >= 0; i--) {
                const smoke = smokeBombs[i];
                const age = now - smoke.startTime;
                if (age > smoke.duration) {
                    smokeBombs.splice(i, 1);
                    continue;
                }
                const alpha = 1 - age / smoke.duration;
                const screenX = smoke.x - camera.x;
                const screenY = smoke.y - camera.y;
                ctx.beginPath();
                ctx.arc(screenX, screenY, smoke.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(80, 80, 80, ${alpha * 0.6})`;
                ctx.fill();
            }
        }

        function drawCooldownOrbs() {
            const now = Date.now();
            cooldownOrbs.forEach(orb => {
                const timeSinceCollected = now - orb.lastCollected;
                if (timeSinceCollected < COOLDOWN_ORB_DURATION) {
                    return; // Still in cooldown, don't draw
                }

                const screenX = orb.x - camera.x;
                const screenY = orb.y - camera.y;
                if (screenX < -50 || screenX > canvas.width + 50 ||
                    screenY < -50 || screenY > canvas.height + 50) return;

                // Pulsing glow
                const pulse = 1 + Math.sin(now / 200) * 0.2;
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.cooldownOrb;
                ctx.shadowBlur = 20;
                ctx.shadowColor = COLORS.cooldownOrb;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Inner circle
                ctx.beginPath();
                ctx.arc(screenX, screenY, orb.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });
        }

        function drawMinimap() {
            const now = Date.now();
            const scaleX = MINIMAP_WIDTH / WORLD_WIDTH;
            const scaleY = MINIMAP_HEIGHT / WORLD_HEIGHT;

            // Minimap background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(MINIMAP_X, MINIMAP_Y, MINIMAP_WIDTH, MINIMAP_HEIGHT);

            // Border
            ctx.strokeStyle = '#444444';
            ctx.lineWidth = 2;
            ctx.strokeRect(MINIMAP_X, MINIMAP_Y, MINIMAP_WIDTH, MINIMAP_HEIGHT);

            // Walls
            ctx.fillStyle = COLORS.wall;
            walls.forEach(w => {
                const mx = MINIMAP_X + w.x * scaleX;
                const my = MINIMAP_Y + w.y * scaleY;
                const mw = w.w * scaleX;
                const mh = w.h * scaleY;
                ctx.fillRect(mx, my, mw, mh);
            });

            // Ghost alert ranges and teleport targets
            ghosts.forEach(ghost => {
                const gmx = MINIMAP_X + ghost.x * scaleX;
                const gmy = MINIMAP_Y + ghost.y * scaleY;

                // Alert range circle
                ctx.beginPath();
                ctx.arc(gmx, gmy, ghost.alertRange * scaleX, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
                ctx.fill();

                // Ghost teleport warning (teleport is random, show indicator when close)
                const timeSinceTeleport = now - ghost.lastTeleport;
                const teleportInterval = 20000; // 20 seconds
                if (timeSinceTeleport > teleportInterval * 0.8) {
                    // Pulsing teleport indicator around ghost
                    const pulse = 0.5 + Math.sin(now / 80) * 0.5;
                    ctx.beginPath();
                    ctx.arc(gmx, gmy, 6 + pulse * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 100, 100, ${0.3 + pulse * 0.4})`;
                    ctx.fill();
                }
            });

            // Items
            items.forEach(item => {
                const imx = MINIMAP_X + item.x * scaleX;
                const imy = MINIMAP_Y + item.y * scaleY;
                ctx.beginPath();
                ctx.arc(imx, imy, 2, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.item;
                ctx.fill();
            });

            // Cooldown orbs
            cooldownOrbs.forEach(orb => {
                if (now - orb.lastCollected < COOLDOWN_ORB_DURATION) return;
                const omx = MINIMAP_X + orb.x * scaleX;
                const omy = MINIMAP_Y + orb.y * scaleY;
                ctx.beginPath();
                ctx.arc(omx, omy, 3, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.cooldownOrb;
                ctx.fill();
            });

            // Exit
            if (exit.active) {
                const emx = MINIMAP_X + exit.x * scaleX;
                const emy = MINIMAP_Y + exit.y * scaleY;
                ctx.beginPath();
                ctx.arc(emx, emy, 4, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.exitActive;
                ctx.fill();
            }

            // Ghosts
            ghosts.forEach(ghost => {
                const gmx = MINIMAP_X + ghost.x * scaleX;
                const gmy = MINIMAP_Y + ghost.y * scaleY;
                ctx.beginPath();
                ctx.arc(gmx, gmy, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0000';
                ctx.fill();
            });

            // Player
            const pmx = MINIMAP_X + player.x * scaleX;
            const pmy = MINIMAP_Y + player.y * scaleY;
            ctx.beginPath();
            ctx.arc(pmx, pmy, 4, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.player;
            ctx.fill();
            ctx.shadowBlur = 5;
            ctx.shadowColor = COLORS.player;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Camera viewport rectangle
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 1;
            ctx.strokeRect(
                MINIMAP_X + camera.x * scaleX,
                MINIMAP_Y + camera.y * scaleY,
                canvas.width * scaleX,
                canvas.height * scaleY
            );
        }

        function drawItemUI() {
            if (!selectedItem) return;

            ctx.textAlign = 'right';
            ctx.font = '16px Arial';
            ctx.fillStyle = '#ffffff';

            const name = selectedItem.name;
            const ready = selectedItem.cooldown <= 0 && !selectedItem.active;
            const active = selectedItem.active;

            ctx.fillStyle = active ? '#00ff00' : ready ? '#ffffff' : '#888888';
            ctx.fillText(`${name}: ${active ? '激活中' : ready ? '就绪' : '冷却中'}`, canvas.width - 20, 35);

            if (!ready && !active) {
                ctx.fillStyle = '#888888';
                ctx.fillText(`${(selectedItem.cooldown / 1000).toFixed(1)}s`, canvas.width - 20, 55);
            }
        }

        function drawInstructions() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '14px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('WASD移动 | 空格技能 | 青色=冷却球 | 红色闪烁=鬼传送点 | 左下小地图', 20, canvas.height - 20);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';

            if (gameResult === 'win') {
                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 52px Arial';
                ctx.fillText('成功逃脱!', canvas.width/2, canvas.height/2 - 40);
                ctx.font = '28px Arial';
                ctx.fillText(`收集了 ${totalCollected} 个物品`, canvas.width/2, canvas.height/2 + 10);
            } else {
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 52px Arial';
                ctx.fillText('被抓住了!', canvas.width/2, canvas.height/2 - 40);
                ctx.font = '28px Arial';
                ctx.fillText(`收集了 ${totalCollected} 个物品`, canvas.width/2, canvas.height/2 + 10);
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = '24px Arial';
            ctx.fillText('点击重新开始', canvas.width/2, canvas.height/2 + 70);
        }

        const ITEMS = [
            { name: '加速药水', desc: '3秒内速度翻倍', color: '#00aaff' },
            { name: '隐身药水', desc: '3秒内鬼无法追踪', color: '#aa00ff' },
            { name: '烟雾弹', desc: '3秒内干扰鬼的视线', color: '#888888' }
        ];

        const ITEM_START_X = 150;
        const ITEM_SPACING = 220;
        const ITEM_WIDTH = 180;
        const ITEM_HEIGHT = 200;

        const ITEM_CLICK_AREAS = ITEMS.map((item, i) => ({
            x: ITEM_START_X + i * ITEM_SPACING,
            y: canvas.height / 2 - 60,
            w: ITEM_WIDTH,
            h: ITEM_HEIGHT
        }));

        let selectedItem = null;
        let hoveredItemIndex = -1;
        let smokeBombs = [];

        function useItem() {
            if (!selectedItem || selectedItem.cooldown > 0 || selectedItem.active) return;

            selectedItem.active = true;
            selectedItem.cooldown = getItemCooldown(selectedItem.name);

            setTimeout(() => {
                selectedItem.active = false;
            }, 3000);

            if (selectedItem.name === '烟雾弹') {
                triggerSmokeBomb();
            }
        }

        function getItemCooldown(itemName) {
            switch(itemName) {
                case '加速药水': return 15000;
                case '隐身药水': return 25000;
                case '烟雾弹': return 30000;
                default: return 25000;
            }
        }

        function triggerSmokeBomb() {
            smokeBombs.push({
                x: player.x,
                y: player.y,
                radius: 100,
                duration: 3000,
                startTime: Date.now()
            });
        }

        function drawItemSelect() {
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('选择你的道具', canvas.width/2, 80);

            ITEMS.forEach((item, i) => {
                const area = ITEM_CLICK_AREAS[i];
                const isHovered = hoveredItemIndex === i;

                ctx.fillStyle = isHovered ? '#ffffff' : item.color;
                ctx.fillRect(area.x, area.y, area.w, area.h);

                if (isHovered) {
                    ctx.strokeStyle = item.color;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(area.x, area.y, area.w, area.h);
                }

                ctx.fillStyle = isHovered ? item.color : '#ffffff';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(item.name, area.x + area.w/2, area.y + 50);

                ctx.font = '14px Arial';
                ctx.fillText(item.desc, area.x + area.w/2, area.y + 100);
            });

            canvas.style.cursor = hoveredItemIndex >= 0 ? 'pointer' : 'default';
        }

        function drawMenu() {
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('鬼 抓 人', canvas.width/2, canvas.height/2 - 60);

            ctx.font = '20px Arial';
            ctx.fillText('收集 20 个物品，从绿色出口逃脱', canvas.width/2, canvas.height/2);
            ctx.fillText('鬼会越来越快，越来越多！', canvas.width/2, canvas.height/2 + 30);

            ctx.font = '24px Arial';
            ctx.fillText('点击开始', canvas.width/2, canvas.height/2 + 90);
        }

        function drawMap() {
            // Background
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Show info
            ctx.fillStyle = '#ffffff';
            ctx.font = '18px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`物品: ${collectedCount}/${ITEMS_TO_WIN}  鬼: ${ghosts.length}`, 20, 30);

            // Walls
            ctx.fillStyle = COLORS.wall;
            walls.forEach(w => {
                const sx = w.x - camera.x;
                const sy = w.y - camera.y;
                if (sx + w.w > 0 && sx < canvas.width && sy + w.h > 0 && sy < canvas.height) {
                    ctx.fillRect(sx, sy, w.w, w.h);
                }
            });

            // Items
            items.forEach(item => {
                const screenX = item.x - camera.x;
                const screenY = item.y - camera.y;
                if (screenX < -20 || screenX > canvas.width + 20 ||
                    screenY < -20 || screenY > canvas.height + 20) return;

                ctx.beginPath();
                ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.item;
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLORS.item;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Exit
            const exitScreenX = exit.x - camera.x;
            const exitScreenY = exit.y - camera.y;
            if (exitScreenX > -50 && exitScreenX < canvas.width + 50 &&
                exitScreenY > -50 && exitScreenY < canvas.height + 50) {
                if (exit.active) {
                    const pulse = 1 + Math.sin(Date.now() / 200) * 0.3;
                    ctx.beginPath();
                    ctx.arc(exitScreenX, exitScreenY, 30 * pulse, 0, Math.PI * 2);
                    ctx.fillStyle = COLORS.exitActive;
                    ctx.shadowBlur = 40;
                    ctx.shadowColor = COLORS.exitActive;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    ctx.beginPath();
                    ctx.arc(exitScreenX, exitScreenY, 25, 0, Math.PI * 2);
                    ctx.fillStyle = COLORS.exitInactive;
                    ctx.fill();
                }
            }
        }

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Clamp dt to prevent huge jumps (max 100ms)
            if (dt > 0.1) dt = 0.1;

            if (gameState === 'menu') {
                drawMenu();
            } else if (gameState === 'itemSelect') {
                drawItemSelect();
            } else if (gameState === 'playing') {
                updatePlayer(dt);
                updateGhosts(dt);
                updateCamera();
                drawMap();
                drawGhosts();
                drawPlayer();
                drawSmokeBombs();
                drawCooldownOrbs();
                drawItemUI();
                drawInstructions();
                drawMinimap();
            } else if (gameState === 'gameover') {
                drawMap();
                drawGhosts();
                drawPlayer();
                drawGameOver();
            }
            requestAnimationFrame(gameLoop);
        }

        gameLoop(0);

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if (gameState === 'menu') {
                gameState = 'itemSelect';
            } else if (gameState === 'itemSelect') {
                for (let i = 0; i < ITEM_CLICK_AREAS.length; i++) {
                    const area = ITEM_CLICK_AREAS[i];
                    if (mx >= area.x && mx <= area.x + area.w && my >= area.y && my <= area.y + area.h) {
                        selectedItem = { ...ITEMS[i], cooldown: 0 };
                        smokeBombs = [];
                        ghosts = [createGhost(100, 100)];
                        lastGhostSpawn = Date.now();
                        generateMap();
                        lastTime = performance.now();
                        gameState = 'playing';
                        break;
                    }
                }
            } else if (gameState === 'gameover') {
                gameState = 'menu';
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            hoveredItemIndex = -1;
            if (gameState === 'itemSelect') {
                ITEM_CLICK_AREAS.forEach((area, i) => {
                    if (mx >= area.x && mx <= area.x + area.w && my >= area.y && my <= area.y + area.h) {
                        hoveredItemIndex = i;
                    }
                });
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoveredItemIndex = -1;
        });
    </script>
</body>
</html>
