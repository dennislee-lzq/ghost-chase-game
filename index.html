<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #16213e;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameState = 'menu'; // menu, itemSelect, playing, gameover
        let lastTime = 0;

        // Colors from design
        const COLORS = {
            background: '#1a1a2e',
            wall: '#16213e',
            player: '#ffffff',
            ghost: 'rgba(255, 0, 0, 0.7)',
            item: '#ffd700',
            exitInactive: '#555555',
            exitActive: '#00ff00',
            ghostVision: 'rgba(255, 100, 100, 0.2)'
        };

        // Player object and input tracking
        let player = { x: 60, y: canvas.height - 60, radius: 12, speed: 150 };
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        // Map generation
        let walls = [];
        let items = [];
        let exit = { x: 0, y: 0, active: false };
        const COLLECTIBLE_COUNT = 8;
        const ITEMS_TO_WIN = 5;
        let collectedCount = 0;

        function generateMap() {
            walls = [];
            items = [];
            collectedCount = 0;
            exit.active = false;

            // Border walls
            walls.push({ x: 0, y: 0, w: canvas.width, h: 20 }); // top
            walls.push({ x: 0, y: canvas.height - 20, w: canvas.width, h: 20 }); // bottom
            walls.push({ x: 0, y: 0, w: 20, h: canvas.height }); // left
            walls.push({ x: canvas.width - 20, y: 0, w: 20, h: canvas.height }); // right

            // Random interior walls (simple room partition)
            const numWalls = 6 + Math.floor(Math.random() * 5);
            for (let i = 0; i < numWalls; i++) {
                const horizontal = Math.random() > 0.5;
                if (horizontal) {
                    const y = 80 + Math.random() * (canvas.height - 160);
                    const x = 40 + Math.random() * (canvas.width - 200);
                    const w = 100 + Math.random() * 150;
                    walls.push({ x, y, w, h: 15 });
                } else {
                    const x = 40 + Math.random() * (canvas.width - 200);
                    const y = 80 + Math.random() * (canvas.height - 160);
                    const h = 100 + Math.random() * 150;
                    walls.push({ x, y, w: 15, h });
                }
            }

            // Generate items at random valid positions
            for (let i = 0; i < COLLECTIBLE_COUNT; i++) {
                items.push(createRandomPosition());
            }

            // Exit at top-right corner area
            exit = { x: canvas.width - 60, y: canvas.height - 60, active: false };
        }

        function createRandomPosition() {
            let pos;
            let attempts = 0;
            do {
                pos = {
                    x: 50 + Math.random() * (canvas.width - 100),
                    y: 50 + Math.random() * (canvas.height - 100)
                };
                attempts++;
            } while (attempts < 50 && isCollidingWithWalls(pos.x, pos.y, 10));
            return pos;
        }

        function isCollidingWithWalls(x, y, radius) {
            for (const w of walls) {
                if (x + radius > w.x && x - radius < w.x + w.w &&
                    y + radius > w.y && y - radius < w.y + w.h) {
                    return true;
                }
            }
            return false;
        }

        function updatePlayer(dt) {
            let dx = 0, dy = 0;
            if (keys.w) dy -= 1;
            if (keys.s) dy += 1;
            if (keys.a) dx -= 1;
            if (keys.d) dx += 1;

            // Normalize diagonal movement
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }

            const speed = selectedItem && selectedItem.active && selectedItem.name === 'Speed Boost'
                ? player.speed * 2 : player.speed;

            let newX = player.x + dx * speed * dt;
            let newY = player.y + dy * speed * dt;

            // Wall collision
            if (!isCollidingWithWalls(newX, player.y, player.radius)) {
                player.x = newX;
            }
            if (!isCollidingWithWalls(player.x, newY, player.radius)) {
                player.y = newY;
            }
        }

        function drawPlayer() {
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.player;
            ctx.fill();
            // Glow effect
            ctx.shadowBlur = 20;
            ctx.shadowColor = COLORS.player;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        const ITEMS = [
            { name: 'Speed Boost', desc: '2x speed for 3 seconds', color: '#00aaff' },
            { name: 'Invisibility', desc: 'Ghost cant track you for 3 seconds', color: '#aa00ff' },
            { name: 'Smoke Bomb', desc: 'Confuse ghost for 3 seconds', color: '#888888' }
        ];

        // Item selection layout constants
        const ITEM_START_X = 150;
        const ITEM_SPACING = 220;
        const ITEM_WIDTH = 180;
        const ITEM_HEIGHT = 200;

        // Pre-calculate item click areas
        const ITEM_CLICK_AREAS = ITEMS.map((item, i) => ({
            x: ITEM_START_X + i * ITEM_SPACING,
            y: canvas.height / 2 - 60,
            w: ITEM_WIDTH,
            h: ITEM_HEIGHT
        }));

        let selectedItem = null;
        let hoveredItemIndex = -1;

        function drawItemSelect() {
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Choose Your Item', canvas.width/2, 80);

            ITEMS.forEach((item, i) => {
                const area = ITEM_CLICK_AREAS[i];
                const isHovered = hoveredItemIndex === i;

                // Box with hover highlight
                ctx.fillStyle = isHovered ? '#ffffff' : item.color;
                ctx.fillRect(area.x, area.y, area.w, area.h);

                // Border for hover
                if (isHovered) {
                    ctx.strokeStyle = item.color;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(area.x, area.y, area.w, area.h);
                }

                // Name
                ctx.fillStyle = isHovered ? item.color : '#ffffff';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(item.name, area.x + area.w/2, area.y + 50);

                // Description
                ctx.font = '14px Arial';
                ctx.fillText(item.desc, area.x + area.w/2, area.y + 100);
            });

            // Update cursor based on hover state
            canvas.style.cursor = hoveredItemIndex >= 0 ? 'pointer' : 'default';
        }

        // Start menu
        function drawMenu() {
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GHOST CHASE', canvas.width/2, canvas.height/2 - 50);

            ctx.font = '24px Arial';
            ctx.fillText('Click to Start', canvas.width/2, canvas.height/2 + 20);
        }

        function drawMap() {
            // Background
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Walls
            ctx.fillStyle = COLORS.wall;
            walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

            // Items
            items.forEach(item => {
                ctx.beginPath();
                ctx.arc(item.x, item.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.item;
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLORS.item;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Exit
            ctx.beginPath();
            ctx.arc(exit.x, exit.y, 20, 0, Math.PI * 2);
            ctx.fillStyle = exit.active ? COLORS.exitActive : COLORS.exitInactive;
            ctx.fill();
        }

        // Main game loop
        function gameLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (gameState === 'menu') {
                drawMenu();
            } else if (gameState === 'itemSelect') {
                drawItemSelect();
            } else if (gameState === 'playing') {
                updatePlayer(dt);
                drawMap();
                drawPlayer();
            }
            requestAnimationFrame(gameLoop);
        }

        // Initialize gameLoop
        gameLoop(0);

        // Click handler for starting game
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if (gameState === 'menu') {
                gameState = 'itemSelect';
            } else if (gameState === 'itemSelect') {
                ITEM_CLICK_AREAS.forEach((area, i) => {
                    if (mx >= area.x && mx <= area.x + area.w && my >= area.y && my <= area.y + area.h) {
                        selectedItem = { ...ITEMS[i], cooldown: 0 };
                        generateMap();
                        gameState = 'playing';
                    }
                });
            }
        });

        // Hover tracking for visual feedback
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            hoveredItemIndex = -1;
            if (gameState === 'itemSelect') {
                ITEM_CLICK_AREAS.forEach((area, i) => {
                    if (mx >= area.x && mx <= area.x + area.w && my >= area.y && my <= area.y + area.h) {
                        hoveredItemIndex = i;
                    }
                });
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoveredItemIndex = -1;
        });
    </script>
</body>
</html>
